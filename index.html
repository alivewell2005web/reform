<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工事進捗">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f5">
<title>リフォーム進捗管理アプリ v47</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f5; --surface-1:#f0efea; --surface-2:#ffffff; --surface-3:#e7e6e0;
  --text-primary:#141412; --text-secondary:#33322d; --text-muted:#5c5b54;
  --text-success:#1a7f4b; --text-danger:#c0392b; --text-accent:#2563eb; --text-warning:#b7791f;
  --border:#d9d8d2; --border-strong:#bfbeb7; --border-accent:#2563eb; --border-warning:#e0a94f;
  --bg-success:#c9ebd6; --bg-accent:#bfdbfe; --bg-accent-muted:#dbeafe; --bg-warning:#fbe6c0; --bg-danger:#fbc9c9; --bg-danger-strong:#f5a9a9;
  --radius:8px;
}
*{box-sizing:border-box;}
body{margin:0; padding:16px; background:var(--bg); color:var(--text-primary); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; font-size:14px;}
button{background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:var(--radius); padding:6px 12px; cursor:pointer; color:var(--text-primary); font-family:inherit;}
button:hover{background:var(--surface-3);}
select,input[type=text],input[type=date]{background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:var(--radius); padding:6px 10px; color:var(--text-primary); font-family:inherit; width:100%;}
table{background:var(--surface-2);}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
.c-green{background:var(--bg-success); color:var(--text-success);}
.c-amber{background:var(--bg-warning); color:var(--text-warning);}
.tabbtn{background:transparent;}
.viewbtn{background:transparent;}
#app{max-width:1200px; margin:0 auto;}
@media (max-width:640px), (pointer:coarse){
  /* タッチ端末ではカレンダーの縦スクロールを最優先（ドラッグ誤爆防止） */
  #calgrid{ touch-action:pan-y !important; }
  #calgrid .chip, #calgrid .xchip, #calgrid .span{ touch-action:pan-y !important; cursor:pointer !important; }
}
</style>
</head>
<body>
<div id="app">

<div style="padding:0.5rem 0;">
<h2 class="sr-only">リフォーム進捗 部屋番号・本日色・週表示・未選択強調</h2>

<div id="syncbar" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 10px; margin-bottom:10px; background:var(--surface-1); border:0.5px solid var(--border); border-radius:10px;">
  <span style="font-size:12px; font-weight:600; color:var(--text-secondary);"><i class="ti ti-cloud" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> 共有</span>
  <button id="btnSettings" style="font-size:12px; padding:4px 12px;"><i class="ti ti-settings" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> 接続設定</button>
  <button id="btnLoad" style="font-size:12px; padding:4px 12px;"><i class="ti ti-refresh" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> 最新を読込</button>
  <span style="width:1px; height:18px; background:var(--border);"></span>
  <button id="btnExport" style="font-size:12px; padding:4px 10px;"><i class="ti ti-download" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> バックアップ書出</button>
  <button id="btnImport" style="font-size:12px; padding:4px 10px;"><i class="ti ti-upload" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> 取込</button>
  <input type="file" id="fileImport" accept="application/json,.json" style="display:none;">
  <span id="syncStatus" style="font-size:11px; color:var(--text-muted); margin-left:auto;"></span>
</div>

<div style="display:flex; gap:8px; margin-bottom:1rem;">
  <button class="tabbtn" data-tab="matrix" style="flex:1; border:1px solid var(--text-accent); border-radius:10px; padding:12px 16px; font-weight:700; font-size:15px; background:var(--text-accent); color:#fff;">工事進捗管理表</button>
  <button class="tabbtn" data-tab="calendar" style="flex:1; border:1px solid var(--border-strong); border-radius:10px; padding:12px 16px; font-weight:700; font-size:15px; background:var(--surface-2); color:var(--text-secondary);">工事カレンダー</button>
</div>

<div id="tab-matrix">
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:0.8rem;">
    <input type="text" id="search" placeholder="現場名・業者名で検索" style="width:auto; min-width:200px;">
    <select id="filter" style="width:auto; min-width:130px;"><option value="incomplete">未完了のみ</option><option value="all">すべて表示</option></select>
    <span style="font-size:12px; color:var(--text-muted); display:inline-flex; align-items:center; gap:6px;">並べ替え：
      <button class="sortbtn" data-sort="phase" style="font-size:12px; padding:3px 10px;">現在地</button>
      <button class="sortbtn" data-sort="name" style="font-size:12px; padding:3px 10px;">現場名</button>
      <button class="sortbtn" data-sort="date1" style="font-size:12px; padding:3px 10px;">①立会日</button>
    </span>
    <button id="clearfilters" style="display:none; font-size:12px; padding:3px 10px; align-items:center; gap:4px; color:var(--text-danger);"><i class="ti ti-filter-off" aria-hidden="true" style="font-size:14px; vertical-align:-2px;"></i> フィルター解除</button>
    <button id="addbtn" style="margin-left:auto;"><i class="ti ti-plus" aria-hidden="true" style="font-size:15px; vertical-align:-2px;"></i> 新規現場</button>
  </div>
  <div style="overflow-x:auto; border:0.5px solid var(--border); border-radius:12px;">
    <table style="border-collapse:collapse; font-size:13px; min-width:1080px;"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>
  <div id="detail" style="margin-top:12px;"></div>
</div>

<div id="tab-calendar" style="display:none;">
  <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:0.7rem;">
    <select id="sitesel" style="width:auto; min-width:150px;"></select>
    <select id="worksel" style="width:auto; min-width:120px;"></select>
    <select id="vendorsel" style="width:auto; min-width:130px;"></select>
    <div style="display:inline-flex; border:0.5px solid var(--border); border-radius:var(--radius); overflow:hidden;">
      <button id="viewmonth" class="viewbtn" style="border:none; border-radius:0; padding:5px 14px; font-size:13px;">月</button>
      <button id="viewweek" class="viewbtn" style="border:none; border-radius:0; padding:5px 14px; font-size:13px; color:var(--text-secondary);">週</button>
    </div>
    <div style="display:flex; align-items:center; gap:6px; margin-left:auto;">
      <button id="prevp" aria-label="前へ" style="padding:4px 10px;"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
      <span id="perlabel" style="font-weight:500; min-width:150px; text-align:center;"></span>
      <button id="nextp" aria-label="次へ" style="padding:4px 10px;"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    </div>
    <button id="zeroholbtn" style="display:none; font-size:13px;"><i class="ti ti-calendar-off" aria-hidden="true" style="font-size:15px; vertical-align:-2px;"></i> ZERO休み登録</button>
    <button id="pdfbtn" style="font-size:13px;"><i class="ti ti-file-type-pdf" aria-hidden="true" style="font-size:15px; vertical-align:-2px;"></i> 業者向けPDF</button>
  </div>
  <div id="legend" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;"></div>
  <div id="calhint" style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;"></div>
  <div id="calgrid" style="position:relative; user-select:none; touch-action:none;"></div>
  <div id="calcolorpicker" style="display:none; margin-top:10px;"></div>
  <div id="unassigned" style="margin-top:14px;"></div>
</div>
</div>

function passColFilters(s){
  if(colFilters.name && !colFilters.name.has(`${s.name} ${s.room}号室`)) return false;
  if(colFilters.category && !colFilters.category.has(s.category)) return false;
  if(colFilters.status && !colFilters.status.has(statusLabel(s))) return false;
  if(colFilters.vendor){ const vs=siteVendors(s); if(!vs.some(v=>colFilters.vendor.has(v))) return false; }
  for(let i=0;i<NPHASE;i++){ if(colFilters.phaseRange[i] && !inRangeVal(phaseDate(s,i),colFilters.phaseRange[i])) return false; }
  if(colFilters.moveinRange && !inRangeVal(s.moveinClean.done,colFilters.moveinRange)) return false;
  if(colFilters.keyRange && !inRangeVal(s.keyChange.done,colFilters.keyRange)) return false;
  return true;
}
function anyColFilterActive(){ return !!(colFilters.name||colFilters.category||colFilters.status||colFilters.vendor||colFilters.moveinRange||colFilters.keyRange||colFilters.phaseRange.some(r=>r)); }
function renderBody(){
  const f=document.getElementById("filter").value;
  const q=(document.getElementById("search").value||"").trim().toLowerCase();
  let rows=sites.slice();
  if(f==="incomplete") rows=rows.filter(s=>!isComplete(s));
  if(q){ rows=rows.filter(s=>{
    const hay=[s.name,s.room,s.name+" "+s.room+"号室",...siteVendors(s)].join(" ").toLowerCase();
    return hay.includes(q);
  }); }
  rows=rows.filter(passColFilters);
  // 並べ替え（切替式）
  if(sortKey==="name") rows.sort((a,b)=>(a.name+a.room).localeCompare(b.name+b.room,"ja"));
  else if(sortKey==="date1") rows.sort((a,b)=>(a.act[0]||a.plan[0]||"9999").localeCompare(b.act[0]||b.plan[0]||"9999"));
  else rows.sort((a,b)=>currentPhase(a)-currentPhase(b)); // phase（既定）
  // ソートボタンのアクティブ表示
  document.querySelectorAll(".sortbtn").forEach(b=>{ const on=b.dataset.sort===sortKey;
    b.style.background=on?"var(--text-accent)":"var(--surface-2)"; b.style.color=on?"#fff":"var(--text-primary)"; b.style.fontWeight=on?"600":"400"; });
  const tb=document.getElementById("tbody");
  if(rows.length===0){tb.innerHTML=`<tr><td colspan="14" style="padding:1.2rem; text-align:center; color:var(--text-muted);">${(q||anyColFilterActive())?"条件に一致する現場がありません":"該当なし"}</td></tr>`; renderDetail(sites.find(s=>s.open)||null); updateFilterClearBtn(); return;}
  tb.innerHTML=rows.map(s=>{
    const cp=currentPhase(s);
    const sl=statusLabel(s);
    const status = (sl==="完了")
      ? `<span class="c-green" style="font-size:11px; padding:2px 6px; border-radius:var(--radius); white-space:nowrap;">完了</span>`
      : `<span class="c-amber" style="font-size:11px; padding:2px 6px; border-radius:var(--radius); font-weight:500; white-space:nowrap;">${sl}</span>`;
    const wn=Object.keys(s.works).length;
    const missing = hasMissingVendor(s);
    const missBadge = missing ? `<span title="業者未設定の工事があります" style="font-size:10px; padding:1px 7px; border-radius:var(--radius); background:var(--bg-warning); color:var(--text-warning); margin-left:6px;"><i class="ti ti-user-exclamation" aria-hidden="true" style="font-size:11px; vertical-align:-1px;"></i> 業者未設定</span>` : "";
    const catColor = s.category==="自社" ? {bg:"#e0e7ff",fg:"#3730a3"} : {bg:"#fef3c7",fg:"#92400e"};
    return `<tr style="border-top:0.5px solid var(--border); ${s.open?'background:var(--bg-accent-muted);':''}">
      <td style="padding:8px 10px; position:sticky; left:0; z-index:1; background:${s.open?'var(--surface-1)':'var(--surface-2)'}; border-right:0.5px solid var(--border);">
        <div style="display:flex; align-items:flex-start; gap:6px;">
          <div data-toggle="${s.id}" style="cursor:pointer; flex:1;">
            <div style="font-weight:500;"><i class="ti ti-chevron-${s.open?'down':'right'}" aria-hidden="true" style="font-size:13px; vertical-align:-1px;"></i> ${s.name}</div>
            <div style="font-size:11px; color:var(--text-secondary); padding-left:16px;">${s.room}号室${wn?` · ④内訳${wn}件`:""}${missBadge}</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:3px; flex:none;">
          <button data-siteedit="${s.id}" title="現場名・区分を編集" style="font-size:11px; padding:2px 7px; color:var(--text-secondary); border-color:var(--border);"><i class="ti ti-pencil" aria-hidden="true" style="font-size:12px; vertical-align:-1px;"></i></button>
          <button data-sitedel="${s.id}" title="この現場を削除" style="font-size:11px; padding:2px 7px; color:var(--text-danger); border-color:var(--border);"><i class="ti ti-trash" aria-hidden="true" style="font-size:12px; vertical-align:-1px;"></i></button>
          </div>
        </div></td>
      <td style="padding:8px 6px; text-align:center; background:${s.open?'var(--surface-1)':'var(--surface-2)'}; border-right:0.5px solid var(--border);">
        <span style="display:inline-block; font-size:11px; font-weight:600; padding:2px 7px; border-radius:var(--radius); background:${catColor.bg}; color:${catColor.fg};">${s.category}</span></td>
      <td style="padding:8px 8px; border-right:0.5px solid var(--border);">${status}</td>
      ${[0,1,2,3,4,5].map(i=>cellHtml(s,i)).join("")}${extraCellHtml(s,"moveinClean")}${extraCellHtml(s,"keyChange")}<td style="padding:5px 6px; border-left:0.5px solid var(--border); vertical-align:top;"><textarea data-memo="${s.id}" rows="2" placeholder="メモ" style="width:130px; box-sizing:border-box; font-size:12px; padding:3px 5px; resize:vertical; min-height:32px;">${(s.memo||"").replace(/</g,"&lt;")}</textarea></td></tr>`;
  }).join("");
  tb.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",()=>{const s=sites.find(x=>x.id===Number(el.dataset.toggle)); if(s){const was=s.open; sites.forEach(x=>x.open=false); s.open=!was; refresh();}}));
  tb.querySelectorAll("[data-siteedit]").forEach(el=>el.addEventListener("click",(e)=>{e.stopPropagation(); openEditSiteModal(Number(el.dataset.siteedit));}));
  tb.querySelectorAll("[data-sitedel]").forEach(el=>el.addEventListener("click",(e)=>{e.stopPropagation(); const id=Number(el.dataset.sitedel); const s=sites.find(x=>x.id===id); if(!s)return; if(confirm(`「${s.name} ${s.room}号室」を削除します。工事内訳や金額など、この現場の全データが消えます。よろしいですか？`)){ sites=sites.filter(x=>x.id!==id); refresh(); }}));
  tb.querySelectorAll("[data-edit]").forEach(el=>el.addEventListener("click",()=>{const [id,idx,kind]=el.dataset.edit.split(":"); const s=sites.find(x=>x.id===Number(id)); if(!s)return; const i=Number(idx);
    if(i===0){ openDateTimeInline(el,s.act[0],s.mtgTime,(dv,tv,ev,av)=>{s.act[0]=dv; s.mtgTime=tv; s.mtgEndTime=ev; s.attendee=av; refresh();},s.mtgEndTime,s.attendee); return; }
    openDateInline(el,s[kind][i],(v)=>{s[kind][i]=v; refresh();});}));
  const openMtg=(s,el)=>openDateTimeInline(el,s.act[0],s.mtgTime,(dv,tv,ev,av)=>{s.act[0]=dv; s.mtgTime=tv; s.mtgEndTime=ev; s.attendee=av; refresh();},s.mtgEndTime,s.attendee);
  tb.querySelectorAll("[data-mtgtime]").forEach(el=>el.addEventListener("click",()=>{const s=sites.find(x=>x.id===Number(el.dataset.mtgtime)); if(s)openMtg(s,el);}));
  tb.querySelectorAll("[data-attendee]").forEach(el=>el.addEventListener("click",()=>{const s=sites.find(x=>x.id===Number(el.dataset.attendee)); if(s)openMtg(s,el);}));
  tb.querySelectorAll("textarea[data-memo]").forEach(el=>el.addEventListener("input",()=>{const s=sites.find(x=>x.id===Number(el.dataset.memo)); if(s){s.memo=el.value; dirty=true; scheduleAutoSave();}}));
  tb.querySelectorAll("[data-xedit]").forEach(el=>el.addEventListener("click",()=>{const [id,field,k]=el.dataset.xedit.split(":"); const s=sites.find(x=>x.id===Number(id)); if(!s)return;
    // 鍵交換の実施日は④予定日(plan[3])より後のみ許可
    let opts={};
    if(field==="keyChange" && k==="done" && s.plan[3]){ opts.min=dateAdd(s.plan[3],1); }
    openDateInline(el,s[field][k],(v)=>{
      if(field==="keyChange" && k==="done" && v && s.plan[3] && v<=s.plan[3]){
        alert(`鍵交換の実施日は、④工事の予定日（${fmt(s.plan[3])}）より後の日付にしてください。`); return;
      }
      s[field][k]=v; refresh();
    }, opts);
  }));
  renderDetail(sites.find(s=>s.open)||null);
  updateFilterClearBtn();
}
// フィルターが有効なとき「フィルター解除」ボタンを表示
function updateFilterClearBtn(){
  const btn=document.getElementById("clearfilters"); if(!btn) return;
  btn.style.display = anyColFilterActive() ? "inline-flex" : "none";
}
function clearAllColFilters(){ colFilters={ name:null, status:null, vendor:null, category:null, phaseRange:[null,null,null,null,null,null], moveinRange:null, keyRange:null }; renderHead(); renderBody(); }

function getByPath(o,p){for(const k of p.split(":"))o=o[k];return o;}
function setByPath(o,p,v){const ks=p.split(":");for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}
function vendorSelectHtml(path,cur){
  const missing=!cur;
  const opts=`<option value=""${!cur?' selected':''}>業者未設定</option>`
    +vendorMaster.map(v=>`<option value="${v}"${v===cur?' selected':''}>${v}</option>`).join("")
    +`<option value="__new__">＋ 新規業者を入力</option>`;
  return `<select data-vsel="${path}" style="width:auto; min-width:130px; font-size:11px; padding:2px 6px; ${missing?'border-color:var(--border-warning); color:var(--text-warning);':''}">${opts}</select>`;
}
// 数値（金額）入力
function moneyInputHtml(dataAttr,cur){
  return `<input type="number" inputmode="numeric" ${dataAttr} value="${cur!=null?cur:''}" placeholder="0" style="width:74px; font-size:11px; padding:2px 5px; text-align:right;">`;
}
// 単純プルダウン（請求先・家具）
function simpleSelectHtml(dataAttr,cur,options){
  return `<select ${dataAttr} style="width:auto; min-width:88px; font-size:11px; padding:2px 6px;">`+
    options.map(o=>`<option value="${o}"${o===cur?' selected':''}>${o}</option>`).join("")+`</select>`;
}
// プルダウン＋フリー入力（オートロック・備考）。プリセット選択かフリー入力。現在値がプリセット外ならフリー入力欄に表示。
function presetOrFreeHtml(kind,cur,presets){
  const isPreset=presets.includes(cur);
  const sel=`<select data-preset="${kind}" style="width:auto; min-width:96px; font-size:11px; padding:2px 6px;">`+
    `<option value="__free__"${!isPreset?' selected':''}>フリー入力</option>`+
    presets.map(o=>`<option value="${o}"${o===cur?' selected':''}>${o}</option>`).join("")+`</select>`;
  const free=`<input type="text" data-free="${kind}" value="${isPreset?'':(cur||'').replace(/"/g,'&quot;')}" placeholder="（空欄可）" style="width:96px; font-size:11px; padding:2px 5px; ${isPreset?'display:none;':''}">`;
  return `<span style="display:inline-flex; gap:4px; align-items:center;">${sel}${free}</span>`;
}

function renderDetail(s){
  const d=document.getElementById("detail");
  if(!s){d.innerHTML=""; return;}
  let rows="";
  const dot=(w)=>{const col=WORKCOLOR[w]; return `<span style="display:inline-block; width:9px; height:9px; border-radius:2px; background:${col.bg}; border:1px solid ${col.fg}; margin-right:5px; vertical-align:0;"></span>`;};
  Object.keys(s.works).forEach(w=>{
    const t=WORKDEF[w].type, wk=s.works[w];
    if(t==="span"){
      const dateCell=`<span data-sp="${s.id}:${w}:start" style="cursor:pointer; color:var(--text-secondary);">${fmt(wk.start)||'—'}</span><span style="color:var(--text-muted);"> 〜 </span><span data-sp="${s.id}:${w}:end" style="cursor:pointer; color:var(--text-secondary);">${fmt(wk.end)||'—'}</span>`;
      rows+=`<tr style="border-top:0.5px solid var(--border);">
        <td style="padding:6px 8px; white-space:nowrap; vertical-align:top;">${dateCell}</td>
        <td style="padding:6px 8px; vertical-align:top; white-space:nowrap;">${dot(w)}${w}</td>
        <td style="padding:6px 8px; vertical-align:top; color:var(--text-muted);">—</td>
        <td style="padding:6px 8px; vertical-align:top;">${vendorSelectHtml(s.id+":"+w+":vendor",wk.vendor)}</td>
        <td style="padding:6px 8px; text-align:right; vertical-align:top;"><button data-wdel="${s.id}:${w}" style="font-size:11px; padding:2px 8px;">削除</button></td></tr>`;
    } else if(t==="multi"){
      const items=wk.items||[];
      if(items.length){
        items.forEach((it,ix)=>{
          rows+=`<tr style="border-top:0.5px solid var(--border);">
            <td style="padding:6px 8px; white-space:nowrap; vertical-align:top;"><span data-medit="${s.id}:${w}:${ix}:plan" style="cursor:pointer; color:var(--text-secondary);">${fmt(it.plan)||'—'}</span></td>
            <td style="padding:6px 8px; vertical-align:top; white-space:nowrap;">${dot(w)}${w}</td>
            <td style="padding:6px 8px; vertical-align:top;"><input type="text" data-mname="${s.id}:${w}:${ix}" value="${(it.name||'').replace(/"/g,'&quot;')}" placeholder="内容（例：給湯器交換）" style="width:auto; min-width:150px; font-size:12px; padding:3px 7px;"></td>
            <td style="padding:6px 8px; vertical-align:top;">${vendorSelectHtml(s.id+":"+w+":items:"+ix+":vendor",it.vendor)} <button data-mdel="${s.id}:${w}:${ix}" style="font-size:11px; padding:1px 7px;">×</button></td>
            <td style="padding:6px 8px; text-align:right; vertical-align:top;">${ix===0?`<button data-wdel="${s.id}:${w}" style="font-size:11px; padding:2px 8px;">削除</button>`:''}</td></tr>`;
        });
      } else {
        rows+=`<tr style="border-top:0.5px solid var(--border);"><td style="padding:6px 8px; color:var(--text-muted);">—</td><td style="padding:6px 8px; white-space:nowrap;">${dot(w)}${w}</td><td colspan="2" style="padding:6px 8px; color:var(--text-muted); font-size:12px;">明細なし</td><td style="padding:6px 8px; text-align:right;"><button data-wdel="${s.id}:${w}" style="font-size:11px; padding:2px 8px;">削除</button></td></tr>`;
      }
      rows+=`<tr><td></td><td colspan="4" style="padding:2px 8px 6px;"><button data-madd="${s.id}:${w}" style="font-size:11px; padding:2px 9px;"><i class="ti ti-plus" aria-hidden="true" style="font-size:12px; vertical-align:-1px;"></i> ${w}明細を追加</button></td></tr>`;
    } else {
      rows+=`<tr style="border-top:0.5px solid var(--border);">
        <td style="padding:6px 8px; white-space:nowrap; vertical-align:top;"><span data-sg="${s.id}:${w}:plan" style="cursor:pointer; color:var(--text-secondary);">${fmt(wk.plan)||'—'}</span></td>
        <td style="padding:6px 8px; vertical-align:top; white-space:nowrap;">${dot(w)}${w}</td>
        <td style="padding:6px 8px; vertical-align:top; color:var(--text-muted);">—</td>
        <td style="padding:6px 8px; vertical-align:top;">${vendorSelectHtml(s.id+":"+w+":vendor",wk.vendor)}</td>
        <td style="padding:6px 8px; text-align:right; vertical-align:top;"><button data-wdel="${s.id}:${w}" style="font-size:11px; padding:2px 8px;">削除</button></td></tr>`;
      if(w==="クリーニング"){
        const rf=s.works["リフォーム"];
        const naiso = rf && rf.end ? fmt(rf.end) : "—";
        rows+=`<tr><td></td><td colspan="4" style="padding:0 8px 8px;">
          <div style="padding:7px 10px; border:0.5px dashed var(--border); border-radius:8px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; font-size:11px;">
          <span style="color:var(--text-muted);">内装完了 <b style="color:var(--text-secondary);">${naiso}</b><span style="font-size:9px;">(自動)</span></span>
          <label style="display:inline-flex; align-items:center; gap:4px;">請求先 ${simpleSelectHtml(`data-site="${s.id}:billTo"`,s.billTo,BILL_OPTS)}</label>
          <label style="display:inline-flex; align-items:center; gap:4px;">家具 ${simpleSelectHtml(`data-site="${s.id}:furniture"`,s.furniture,FURN_OPTS)}</label>
          <label style="display:inline-flex; align-items:center; gap:4px;">清掃費 ${moneyInputHtml(`data-fee="${s.id}:cleanFee"`,wk.cleanFee)}</label>
          <label style="display:inline-flex; align-items:center; gap:4px;">エアコン ${moneyInputHtml(`data-fee="${s.id}:acFee"`,wk.acFee)}</label>
          <label style="display:inline-flex; align-items:center; gap:4px;">剥離 ${moneyInputHtml(`data-fee="${s.id}:peelFee"`,wk.peelFee)}</label>
          <label style="display:inline-flex; align-items:center; gap:4px;">オートロック ${presetOrFreeHtml(`${s.id}:autolock`,s.autolock,AUTOLOCK_PRESETS)}</label>
          <label style="display:inline-flex; align-items:center; gap:4px;">備考 ${presetOrFreeHtml(`${s.id}:note`,s.note,NOTE_PRESETS)}</label>
          </div></td></tr>`;
      }
    }
  });
  d.innerHTML=`<div style="background:var(--surface-1); border:0.5px solid var(--border); border-radius:12px; padding:12px 16px;">
    <div style="font-size:13px; font-weight:500; margin-bottom:10px;">④ 工事手配の内訳 — ${s.name} ${s.room}号室</div>
    <div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:12px;">
      <tr style="color:var(--text-secondary); text-align:left;"><th style="padding:4px 8px; font-weight:400; white-space:nowrap;">日付</th><th style="padding:4px 8px; font-weight:400;">種別</th><th style="padding:4px 8px; font-weight:400;">内容</th><th style="padding:4px 8px; font-weight:400;">業者</th><th></th></tr>
      ${rows||`<tr><td colspan="5" style="padding:8px; color:var(--text-muted);">内訳なし</td></tr>`}
    </table></div>
    <div style="margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;">
      ${WORKS.filter(w=>!(w in s.works)).map(w=>`<button data-wadd="${s.id}:${w}" style="font-size:11px; padding:3px 9px;"><i class="ti ti-plus" aria-hidden="true" style="font-size:12px; vertical-align:-1px;"></i> ${w}</button>`).join("")}
    </div></div>`;

  const sid=s.id;
  d.querySelectorAll("[data-sg]").forEach(el=>el.addEventListener("click",()=>{const [id,w,k]=el.dataset.sg.split(":"); const s2=sites.find(x=>x.id===Number(id)); openDateInline(el,s2.works[w][k],v=>{s2.works[w][k]=v; syncAndRefresh(s2);});}));
  d.querySelectorAll("[data-sp]").forEach(el=>el.addEventListener("click",()=>{const [id,w,k]=el.dataset.sp.split(":"); const s2=sites.find(x=>x.id===Number(id)); editSpanDate(s2,w,k,el);}));
  d.querySelectorAll("[data-medit]").forEach(el=>el.addEventListener("click",()=>{const [id,w,ix,k]=el.dataset.medit.split(":"); const s2=sites.find(x=>x.id===Number(id)); openDateInline(el,s2.works[w].items[ix][k],v=>{s2.works[w].items[ix][k]=v; syncAndRefresh(s2);});}));
  d.querySelectorAll("input[data-mname]").forEach(el=>{ el.addEventListener("input",()=>{ const [id,w,ix]=el.dataset.mname.split(":"); const s2=sites.find(x=>x.id===Number(id)); s2.works[w].items[Number(ix)].name=el.value; }); });
  d.querySelectorAll("select[data-vsel]").forEach(el=>{
    el.addEventListener("change",()=>{
      const path=el.dataset.vsel;
      if(el.value==="__new__"){ const v=prompt("新規業者名を入力"); if(v&&v.trim()){ const nv=v.trim(); if(!vendorMaster.includes(nv))vendorMaster.push(nv); setByPath(sites.find(x=>x.id===sid).works,path.substring(path.indexOf(":")+1),nv); } refresh(); return; }
      setByPath(sites.find(x=>x.id===sid).works, path.substring(path.indexOf(":")+1), el.value||null); refresh();
    });
  });
  d.querySelectorAll("[data-madd]").forEach(el=>el.addEventListener("click",()=>{const [id,w]=el.dataset.madd.split(":"); const s2=sites.find(x=>x.id===Number(id)); s2.works[w].items=s2.works[w].items||[]; s2.works[w].items.push({name:"",plan:null,act:null,vendor:DEFAULT_VENDOR[w]||null}); refresh();}));
  d.querySelectorAll("[data-mdel]").forEach(el=>el.addEventListener("click",()=>{const [id,w,ix]=el.dataset.mdel.split(":"); const s2=sites.find(x=>x.id===Number(id)); s2.works[w].items.splice(Number(ix),1); refresh();}));
  d.querySelectorAll("[data-wadd]").forEach(el=>el.addEventListener("click",()=>{const [id,w]=el.dataset.wadd.split(":"); const s2=sites.find(x=>x.id===Number(id)); const t=WORKDEF[w].type; const dv=DEFAULT_VENDOR[w]||null; s2.works[w]=t==="span"?{start:null,end:null,act:null,vendor:dv}:t==="multi"?{items:[]}:{plan:null,act:null,vendor:dv}; refresh();}));
  d.querySelectorAll("[data-wdel]").forEach(el=>el.addEventListener("click",()=>{const [id,w]=el.dataset.wdel.split(":"); const s2=sites.find(x=>x.id===Number(id)); delete s2.works[w]; refresh();}));
  // 金額（清掃費・エアコン・剥離）: クリーニング工事に保存。入力中は再描画しない
  d.querySelectorAll("input[data-fee]").forEach(el=>{ el.addEventListener("input",()=>{ const [id,field]=el.dataset.fee.split(":"); const s2=sites.find(x=>x.id===Number(id)); const wk=s2.works["クリーニング"]; if(wk){ const v=el.value.trim(); wk[field]= v===""?null:Number(v); } }); });
  // 請求先・家具（現場単位、単純プルダウン）

function daysInPeriod(){
  if(calView==="week"){
    let start;
    if(weekFromToday){ start=new Date(TODAY); }
    else { const d=new Date(calAnchor); const dow=d.getDay(); start=new Date(d); start.setDate(d.getDate()-dow); }
    return Array.from({length:7},(_,i)=>{const x=new Date(start); x.setDate(start.getDate()+i); return x;});
  }
  const y=calAnchor.getFullYear(), m=calAnchor.getMonth(); const days=new Date(y,m+1,0).getDate();
  return Array.from({length:days},(_,i)=>new Date(y,m,i+1));
}
function sitematch(s){ return calSite==="all"||s.id===Number(calSite); }
// カレンダーの業者フィルタ判定（all / アルファ&ZERO複合 / 単一業者）
function vendorMatch(v){ if(calVendor==="all") return true; if(calVendor===VENDOR_AZ) return AZ_VENDORS.includes(v); return v===calVendor; }
// 業者フィルタが「特定業者に絞られている」か（all以外＝立会/清掃/鍵の非業者チップは出さない、の判定に使用）
function vendorFiltered(){ return calVendor!=="all"; }
// 単一業者に絞り込み中か（要件6：色変更UIを出す条件。アルファ&ZEROは対象外）
function singleVendorFilter(){ return calVendor!=="all" && calVendor!==VENDOR_AZ; }
// ZERO休みをカレンダー表示すべきか（現場名 / ZERO / アルファ&ZERO 絞り込み時）
function showZeroHolidays(){ return calSite!=="all" || calVendor==="ZERO" || calVendor===VENDOR_AZ; }
// 要件6：クリック対象の予定に付いたカスタム色を、単一業者絞り込み時のみ適用。無ければ工事色（ZEROクリーニングは請求先色）
function effColor(work,site,customColor){
  if(singleVendorFilter() && customColor) return customColor;
  // 要件1②：ZEROのみ絞り込み時、クリーニングは請求先で色分け
  if(calVendor==="ZERO" && work==="クリーニング"){ return ZERO_BILL_COLOR[site.billTo]||WORKCOLOR["クリーニング"]; }
  return WORKCOLOR[work];
}
// 現在のカレンダー表示期間内に、表示対象の予定が1件以上ある現場（完了分含む）を返す。
// 工事フィルタ・業者フィルタは考慮するが、現場フィルタ自体は無視（選択肢生成用）。
function sitesInView(){
  const days=daysInPeriod();
  const first=iso(days[0].getFullYear(),days[0].getMonth(),days[0].getDate());
  const last=iso(days[days.length-1].getFullYear(),days[days.length-1].getMonth(),days[days.length-1].getDate());
  const inRange=(a,b)=>{ if(!a)return false; const bb=b||a; return a<=last && bb>=first; };
  const wantWork=(w)=> calWork==="all"||calWork===w;
  const wantMtg = calWork==="all"||calWork===EXTRA_MTG.key;
  const wantMovein = calWork==="all"||calWork===EXTRA_MOVEIN.key;
  const wantKey = calWork==="all"||calWork===EXTRA_KEY.key;
  const out=[];
  sites.forEach(s=>{
    let hit=false;
    // 工事
    Object.keys(s.works).forEach(w=>{ if(hit||!wantWork(w))return; const t=WORKDEF[w].type, wk=s.works[w];
      if(t==="span"){ if(vendorMatch(wk.vendor)&&inRange(wk.start,wk.end)) hit=true; }
      else if(t==="single"){ if(vendorMatch(wk.vendor)&&inRange(wk.plan,null)) hit=true; }
      else if(t==="multi"){ (wk.items||[]).forEach(it=>{ if(vendorMatch(it.vendor)&&inRange(it.plan,null)) hit=true; }); }
    });
    // 立会・入居前清掃・鍵交換（業者フィルタ時は対象外）
    if(!hit && !vendorFiltered()){
      if(wantMtg && inRange(s.act[0],null)) hit=true;
      else if(wantMovein && inRange(s.moveinClean.done,null)) hit=true;
      else if(wantKey && inRange(s.keyChange.done,null)) hit=true;
    }
    if(hit) out.push(s);
  });
  return out;
}
function collectSpans(){
  const wmatch=(w)=> calWork==="all"||w===calWork;
  let e=[];
  sites.forEach(s=>{ if(!sitematch(s))return; Object.keys(s.works).forEach(w=>{ if(!wmatch(w))return; if(WORKDEF[w].type!=="span")return; const wk=s.works[w]; if(wk.start&&wk.end&&vendorMatch(wk.vendor)) e.push({start:wk.start,end:wk.end,work:w,site:s,vendor:wk.vendor,done:!!wk.act,color:wk.calColor||null,ref:{kind:"span",id:s.id,w}});});});
  return e;
}
function singlesOnDay(key){
  const wmatch=(w)=> calWork==="all"||w===calWork;
  let out=[];
  sites.forEach(s=>{ if(!sitematch(s))return; Object.keys(s.works).forEach(w=>{ if(!wmatch(w))return; const t=WORKDEF[w].type, wk=s.works[w];
    if(t==="multi"){ (wk.items||[]).forEach((it,ix)=>{ if(it.plan===key&&vendorMatch(it.vendor)) out.push({work:w,site:s,vendor:it.vendor,name:it.name,done:!!it.act,color:it.calColor||null,ref:{kind:"multi",id:s.id,w,ix}}); }); }
    else if(t==="single"){ if(wk.plan===key&&vendorMatch(wk.vendor)) out.push({work:w,site:s,vendor:wk.vendor,done:!!wk.act,color:wk.calColor||null,ref:{kind:"single",id:s.id,w}}); }
  });});
  return out;
}
// 入居前清掃・鍵交換の「実施日」をカレンダー表示（業者フィルタ対象外、工事フィルタは専用値で連動）。ドラッグ不可の表示チップ。
function extraChipsOnDay(key){
  let out=[];
  const wantAll = calWork==="all";
  sites.forEach(s=>{ if(!sitematch(s))return;
    if((wantAll||calWork===EXTRA_MTG.key) && s.act[0]===key) out.push({kind:"mtg",site:s,color:EXTRA_MTG.color,abbr:EXTRA_MTG.abbr,time:mtgTimeLabel(s)});
    if((wantAll||calWork===EXTRA_MOVEIN.key) && s.moveinClean.done===key) out.push({kind:"movein",site:s,color:EXTRA_MOVEIN.color,abbr:EXTRA_MOVEIN.abbr});
    if((wantAll||calWork===EXTRA_KEY.key) && s.keyChange.done===key) out.push({kind:"key",site:s,color:EXTRA_KEY.color,abbr:EXTRA_KEY.abbr});
  });
  // 1現場に絞ったとき（かつ工事フィルタ=すべて）は、②③⑤⑥の工程日も工程名付きで表示（実績優先、なければ予定）
  if(calSite!=="all" && !vendorFiltered() && wantAll){
    const s=sites.find(x=>String(x.id)===String(calSite));
    if(s){ [1,2,4,5].forEach(i=>{ if(!isPhaseActive(s,i))return; const dt=s.act[i]||s.plan[i]; if(dt===key){ out.push({kind:"phase",site:s,phaseIdx:i,color:PHASE_MILESTONE_COLOR,abbr:PHASES[i].slice(1)}); } }); }
  }
  // 業者フィルタが特定業者のときは工事に業者が無いこれらは出さない
  if(vendorFiltered()) return [];
  return out;
}
function extraChipLabel(e){ const t=e.time?` ${e.time}`:''; return calSite!=="all" ? `[${e.abbr}]${t}` : `[${e.abbr}]${siteLabel(e.site)}${t}`; }
function siteLabel(s){ return `${s.name} ${s.room}`; }
function labelText(e){
  if(calSite!=="all"){ const v=e.vendor?` /${e.vendor}`:""; const nm=e.name?e.name:""; return `[${WORKABBR[e.work]}]${nm}${v}`; }
  if(calWork==="all"){ const v=e.vendor?` /${e.vendor}`:""; const nm=e.name?`·${e.name}`:""; return `[${WORKABBR[e.work]}]${siteLabel(e.site)}${nm}${v}`; }
  const v=e.vendor?` /${e.vendor}`:""; const nm=e.name?`·${e.name}`:""; return `${siteLabel(e.site)}${nm}${v}`;
}

function dayKeyAtPoint(x,y){
  const els=document.elementsFromPoint(x,y);
  for(const el of els){ if(el.dataset&&el.dataset.day) return el.dataset.day; const c=el.closest&&el.closest("[data-day]"); if(c) return c.dataset.day; }
  return null;
}

let DND=null;
function isPhone(){
  // タッチ主体の端末（スマホ/タブレット）はカレンダー内ドラッグ無効・タップのみ。
  // 幅ではなく入力方式で判定するため、横向きや画面拡大でも判定が外れない。
  const coarse = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
  const narrow = window.matchMedia && window.matchMedia("(max-width:640px)").matches;
  return coarse || narrow;
}
function startDrag(el, e, payload){
  // スマホ幅かつカレンダー内のチップは、ドラッグ無効・タップのみ（スクロール誤爆防止）
  const inCalendar = el.closest && (el.closest(".daycell") || el.closest("#calgrid"));
  if(isPhone() && inCalendar){
    let sx=e.clientX, sy=e.clientY, moved=false;
    const mv=(ev)=>{ if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>8) moved=true; };
    const up=(ev)=>{ el.removeEventListener("pointermove",mv); el.removeEventListener("pointerup",up); el.removeEventListener("pointercancel",up);
      if(!moved && payload.onClick) payload.onClick(); };
    el.addEventListener("pointermove",mv); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
    return; // preventDefaultしない→ブラウザのスクロールがそのまま効く
  }
  DND={payload, moved:false, startX:e.clientX, startY:e.clientY, ghost:null, el, pid:e.pointerId};
  try{ if(e.pointerId!=null && el.setPointerCapture) el.setPointerCapture(e.pointerId); }catch(_){}
  const move=(ev)=>{
    const dx=Math.abs(ev.clientX-DND.startX), dy=Math.abs(ev.clientY-DND.startY);
    if(!DND.moved && dx+dy<5) return;
    DND.moved=true;
    if(ev.cancelable) ev.preventDefault();
    if(!DND.ghost){ const g=document.createElement("div"); g.textContent=payload.label; g.style.cssText=`position:fixed; z-index:9999; pointer-events:none; font-size:10px; padding:2px 6px; border-radius:5px; background:${payload.bg}; color:${payload.fg}; box-shadow:0 2px 8px rgba(0,0,0,.2); opacity:.9;`; document.body.appendChild(g); DND.ghost=g; }
    DND.ghost.style.left=(ev.clientX+8)+"px"; DND.ghost.style.top=(ev.clientY+8)+"px";
    document.querySelectorAll(".daycell").forEach(c=>c.style.outline="none");
    const key=dayKeyAtPoint(ev.clientX,ev.clientY);
    if(key){ const cell=document.querySelector(`.daycell[data-day="${key}"]`); if(cell){cell.style.outline="2px solid var(--border-accent)"; cell.style.outlineOffset="-2px";} }
    const uz=document.getElementById("unassigned");
    if(uz){ uz.style.outline = overUnassigned(ev.clientX,ev.clientY) ? "2px dashed var(--text-danger)" : "none"; }
  };
  const up=(ev)=>{
    el.removeEventListener("pointermove",move); el.removeEventListener("pointerup",up); el.removeEventListener("pointercancel",up);
    try{ if(DND.pid!=null && el.releasePointerCapture) el.releasePointerCapture(DND.pid); }catch(_){}
    document.querySelectorAll(".daycell").forEach(c=>c.style.outline="none");
    const uz=document.getElementById("unassigned"); if(uz) uz.style.outline="none";
    if(DND.ghost) DND.ghost.remove();
    if(DND.moved){
      if(overUnassigned(ev.clientX,ev.clientY)){ unassignPayload(payload); }
      else { const key=dayKeyAtPoint(ev.clientX,ev.clientY); if(key) applyDrop(payload,key); }
    }
    else if(payload.onClick){ payload.onClick(); }
    DND=null;
  };
  el.addEventListener("pointermove",move);
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
}
function overUnassigned(x,y){
  const uz=document.getElementById("unassigned"); if(!uz) return false;
  const r=uz.getBoundingClientRect();
  return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
}
// カレンダー上の予定を未手配（日付なし）に戻す
function unassignPayload(payload){
  if(payload.type==="span"){ const s=sites.find(x=>x.id===payload.id); const wk=s.works[payload.w]; wk.start=null; wk.end=null; syncAndRefresh(s); }
  else if(payload.type==="chip"){ const r=payload.ref; const s=sites.find(x=>x.id===r.id); if(r.kind==="single")s.works[r.w].plan=null; else s.works[r.w].items[r.ix].plan=null; syncAndRefresh(s); }
  else if(payload.type==="extra"){ const s=sites.find(x=>x.id===payload.id); s[payload.field].done=null; refresh(); }
  else if(payload.type==="mtg"){ const s=sites.find(x=>x.id===payload.id); s.act[0]=null; refresh(); }
  // type==="new" は元々未手配なので何もしない
}
function applyDrop(payload,key){
  if(payload.type==="span"){ const s=sites.find(x=>x.id===payload.id); const wk=s.works[payload.w]; const len=dateDiff(wk.start,wk.end); wk.start=key; wk.end=dateAdd(key,len); syncAndRefresh(s); }
  else if(payload.type==="chip"){ const r=payload.ref; const s=sites.find(x=>x.id===r.id); if(r.kind==="single")s.works[r.w].plan=key; else s.works[r.w].items[r.ix].plan=key; syncAndRefresh(s); }
  else if(payload.type==="new"){ const s=sites.find(x=>x.id===payload.id); const wk=s.works[payload.w];
    if(WORKDEF[payload.w].type==="span"){ wk.start=key; wk.end=key; } else if(WORKDEF[payload.w].type==="multi"){ if(payload.ix!=null&&wk.items&&wk.items[payload.ix]) wk.items[payload.ix].plan=key; } else { wk.plan=key; } syncAndRefresh(s); }
  else if(payload.type==="extra"){ const s=sites.find(x=>x.id===payload.id);
    if(payload.field==="keyChange" && s.plan[3] && key<=s.plan[3]){ alert(`鍵交換の実施日は、④工事の予定日（${fmt(s.plan[3])}）より後の日付にしてください。`); return; }
    s[payload.field].done=key; refresh(); }
  else if(payload.type==="mtg"){ const s=sites.find(x=>x.id===payload.id); s.act[0]=key; refresh(); }
  else if(payload.type==="phase"){ const s=sites.find(x=>x.id===payload.id); const i=payload.phaseIdx; if(payload.useAct) s.act[i]=key; else s.plan[i]=key; refresh(); }
}

      const chips=singles.map((e,i)=>{const c=effColor(e.work,e.site,e.color); return `<div class="chip" data-chipkey="${k}__${i}" title="${labelText(e)}" style="cursor:grab; touch-action:none; background:${e.done?c.done:c.bg}; color:${c.fg}; font-size:10px; line-height:1.25; padding:2px 5px; margin-top:2px; border-radius:5px; white-space:normal; word-break:break-word;">${labelText(e)}</div>`;}).join("");
      const extras=extraChipsOnDay(k);
      const extraChips=extras.map((e,i)=>`<div class="xchip" data-xchipkey="${k}__${i}" title="${extraChipLabel(e)}（実施）" style="cursor:grab; touch-action:none; background:${e.color.done}; color:#fff; font-size:10px; line-height:1.25; padding:2px 5px; margin-top:2px; border-radius:5px; white-space:normal; word-break:break-word; border:1px solid ${e.color.fg};">${extraChipLabel(e)}</div>`).join("");
      const isZeroHol = showZeroHolidays() && zeroHolidays.has(k);
      const dnumColor = isToday?'var(--text-accent)':(hol?'var(--text-danger)':(dow===0?'var(--text-danger)':dow===6?'var(--text-accent)':'var(--text-secondary)'));
      const cellBg = isToday?'var(--bg-accent-muted)':(hol?'#f8d7d7':(isZeroHol?'#e5e7eb':'var(--surface-2)'));
      const holLabel = (hol?`<div title="${hol}" style="font-size:9px; color:var(--text-danger); line-height:1.1; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${hol}</div>`:'')
        +(isZeroHol?`<div title="ZERO休み" style="font-size:9px; color:#6b7280; font-weight:600; line-height:1.1; margin-top:1px;">ZERO休み</div>`:'');
      cellsHtml+=`<div class="daycell" data-day="${k}" style="min-height:${cellMinH}px; border:${isToday?'1.5px solid var(--border-accent)':'0.5px solid var(--border)'}; border-radius:8px; padding:4px; background:${cellBg};">
        <div style="font-size:12px; display:flex; align-items:center; gap:4px; color:${dnumColor}; font-weight:${isToday?'700':'400'};">${dt.getDate()}${isToday?'<span style="font-size:9px; padding:0 4px; border-radius:4px; background:var(--bg-accent); color:var(--text-accent);">今日</span>':''}</div>${holLabel}
        <div style="height:${spanAreaH}px;"></div>${chips}${extraChips}</div>`;
    });
    cellsHtml+=`</div>`;

    const colW=100/7;
    let overlay=`<div style="position:absolute; inset:0; pointer-events:none;">`;
    spans.forEach((e)=>{
      const weekKeys=week.map(dt=>dt?keyOf(dt):null);
      let fc=-1,lc=-1; for(let c=0;c<7;c++){const k=weekKeys[c]; if(k&&k>=e.start&&k<=e.end){if(fc<0)fc=c; lc=c;}}
      if(fc<0) return;
      const left=fc*colW, width=(lc-fc+1)*colW, top=topPad+e.slot*(ROW+GAP);
      const startsHere=weekKeys[fc]===e.start, endsHere=weekKeys[lc]===e.end;
      const c=effColor(e.work,e.site,e.color), bg=e.done?c.done:c.bg, fg=c.fg;
      const radius=`${startsHere?'6px':'2px'} ${endsHere?'6px':'2px'} ${endsHere?'6px':'2px'} ${startsHere?'6px':'2px'}`;
      overlay+=`<div class="span" data-spankey="${e.site.id}__${e.work}" title="${labelText(e)}" style="pointer-events:auto; cursor:grab; touch-action:none; position:absolute; left:calc(${left}% + 4px); width:calc(${width}% - 8px); top:${top}px; height:${ROW}px; line-height:${ROW}px; font-size:10px; padding:0 5px; border-radius:${radius}; background:${bg}; color:${fg}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500;">${labelText(e)}</div>`;
    });
    overlay+=`</div>`;
    weeksHtml+=`<div style="position:relative; margin-bottom:4px;">${cellsHtml}${overlay}</div>`;
  });

  const grid=document.getElementById("calgrid");
  grid.innerHTML=headRow+weeksHtml;
  wireCalendar(grid);
}

// ===== レーンモード描画 =====
// groupBySite=true : 現場ごとに固定レーンで高さを揃える（絞り込み時）
// groupBySite=false: 現場でまとめず、各日その日の予定を上から詰める（全件表示。帯エリア廃止）
function renderCalendarLanes(spans, days, groupBySite){
  const keyOf=dt=>iso(dt.getFullYear(),dt.getMonth(),dt.getDate());
  const tKey=todayKey();
  let weeks=[];
  if(calView==="week") weeks=[days];
  else { const firstDow=days[0].getDay(); let row=new Array(firstDow).fill(null); days.forEach(dt=>{row.push(dt); if(row.length===7){weeks.push(row); row=[];}}); if(row.length){while(row.length<7)row.push(null); weeks.push(row);} }

  const wd=["日","月","火","水","木","金","土"];
  let headRow;
  if(calView==="week"){
    headRow=`<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px;">`+days.map(dt=>`<div style="text-align:center; font-size:11px; color:${dt.getDay()===0?'var(--text-danger)':dt.getDay()===6?'var(--text-accent)':'var(--text-secondary)'};">${wd[dt.getDay()]} ${dt.getMonth()+1}/${dt.getDate()}</div>`).join("")+`</div>`;
  } else {
    headRow=`<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px;">`+wd.map((d,i)=>`<div style="text-align:center; font-size:11px; color:${i===0?'var(--text-danger)':i===6?'var(--text-accent)':'var(--text-secondary)'};">${d}</div>`).join("")+`</div>`;
  }

  const colW=100/7, topPad=26;
  let weeksHtml="";
  weeks.forEach(week=>{
    const weekKeys=week.map(dt=>dt?keyOf(dt):null);
    // グルーピングキー：現場別 or 全件（"_all"に集約）
    const gid=(id)=> groupBySite ? id : "_all";
    const siteOrder=[]; const seen=new Set();
    const spanBySite={};        // gid -> spans[]
    const singleByCell={};      // "gid__dayIndex" -> [{kind,e,i,k}]
    const noteFirst=(g)=>{ if(!seen.has(g)){ seen.add(g); siteOrder.push(g); } };

    spans.forEach(e=>{ let fc=-1; for(let c=0;c<7;c++){const k=weekKeys[c]; if(k&&k>=e.start&&k<=e.end){fc=c;break;}} if(fc<0)return; const g=gid(e.site.id); (spanBySite[g]=spanBySite[g]||[]).push(e); noteFirst(g); });
    for(let c=0;c<7;c++){ const k=weekKeys[c]; if(!k)continue;
      singlesOnDay(k).forEach((e,i)=>{ const g=gid(e.site.id); noteFirst(g); const kk=g+"__"+c; (singleByCell[kk]=singleByCell[kk]||[]).push({kind:"chip",e,i,k}); });
      extraChipsOnDay(k).forEach((e,i)=>{ const g=gid(e.site.id); noteFirst(g); const kk=g+"__"+c; (singleByCell[kk]=singleByCell[kk]||[]).push({kind:"xchip",e,i,k}); });
    }

    // レーン高さ＝その週で「同一グループ・同一日」に載る最大アイテム数（帯も1件として数える）
    const laneRows={}, laneBase={}; let cursor=0;
    siteOrder.forEach(g=>{
      let maxDay=1;
      for(let c=0;c<7;c++){ const k=weekKeys[c]; if(!k)continue;
        let n=0;
        (spanBySite[g]||[]).forEach(e=>{ if(k>=e.start&&k<=e.end) n++; });
        const arr=singleByCell[g+"__"+c]; if(arr) n+=arr.length;
        if(n>maxDay) maxDay=n;
      }
      laneRows[g]=maxDay; laneBase[g]=cursor; cursor+=maxDay;
    });
    const areaH=cursor*(ROW+GAP);
    const cellMinH=(calView==="week"?120:74);

    // セル本体
    let cellsHtml=`<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; position:relative;">`;
    week.forEach(dt=>{
      if(!dt){ cellsHtml+=`<div></div>`; return; }
      const k=keyOf(dt), dow=dt.getDay(), isToday=(k===tKey), hol=holidayName(k);
      const isZeroHol = showZeroHolidays() && zeroHolidays.has(k);
      const dnumColor = isToday?'var(--text-accent)':(hol?'var(--text-danger)':(dow===0?'var(--text-danger)':dow===6?'var(--text-accent)':'var(--text-secondary)'));
      const cellBg = isToday?'var(--bg-accent-muted)':(hol?'#f8d7d7':(isZeroHol?'#e5e7eb':'var(--surface-2)'));
      const holLabel = (hol?`<div title="${hol}" style="font-size:9px; color:var(--text-danger); line-height:1.1; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${hol}</div>`:'')
        +(isZeroHol?`<div title="ZERO休み" style="font-size:9px; color:#6b7280; font-weight:600; line-height:1.1; margin-top:1px;">ZERO休み</div>`:'');
      cellsHtml+=`<div class="daycell" data-day="${k}" style="min-height:${cellMinH}px; border:${isToday?'1.5px solid var(--border-accent)':'0.5px solid var(--border)'}; border-radius:8px; padding:4px; background:${cellBg};">
        <div style="font-size:12px; display:flex; align-items:center; gap:4px; color:${dnumColor}; font-weight:${isToday?'700':'400'};">${dt.getDate()}${isToday?'<span style="font-size:9px; padding:0 4px; border-radius:4px; background:var(--bg-accent); color:var(--text-accent);">今日</span>':''}</div>${holLabel}
        <div style="height:${areaH}px;"></div></div>`;
    });
    cellsHtml+=`</div>`;

    // オーバーレイ：現場レーンの先頭行(サブ0)から、その日のアイテムを順に積む
    let overlay=`<div style="position:absolute; inset:0; pointer-events:none;">`;
    // 各日・各現場のサブ行カウンタ
    const subUsed={}; // "id__c" -> 次に使うサブ行番号
    const nextSub=(id,c)=>{ const kk=id+"__"+c; const v=subUsed[kk]||0; subUsed[kk]=v+1; return v; };
    // 帯（開始日のサブ行を確保し、その行で全期間を描く）
    siteOrder.forEach(id=>{ (spanBySite[id]||[]).forEach(e=>{
      let fc=-1,lc=-1; for(let c=0;c<7;c++){const k=weekKeys[c]; if(k&&k>=e.start&&k<=e.end){if(fc<0)fc=c; lc=c;}} if(fc<0)return;
      const sub=nextSub(id,fc); // 開始日でサブ行を確保。他日も同じ行に描く（掛かる各日でその行を消費）
      for(let c=fc+1;c<=lc;c++){ if((subUsed[id+"__"+c]||0)<=sub) subUsed[id+"__"+c]=sub+1; }
      const left=fc*colW, width=(lc-fc+1)*colW, top=topPad+(laneBase[id]+sub)*(ROW+GAP);
      const startsHere=weekKeys[fc]===e.start, endsHere=weekKeys[lc]===e.end;
      const c=effColor(e.work,e.site,e.color), bg=e.done?c.done:c.bg, fg=c.fg;
      const radius=`${startsHere?'6px':'2px'} ${endsHere?'6px':'2px'} ${endsHere?'6px':'2px'} ${startsHere?'6px':'2px'}`;
      overlay+=`<div class="span" data-spankey="${e.site.id}__${e.work}" title="${labelText(e)}" style="pointer-events:auto; cursor:grab; touch-action:none; position:absolute; left:calc(${left}% + 4px); width:calc(${width}% - 8px); top:${top}px; height:${ROW}px; line-height:${ROW}px; font-size:10px; padding:0 5px; border-radius:${radius}; background:${bg}; color:${fg}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500;">${labelText(e)}</div>`;
    }); });
    // 単日・追加（帯の下の空きサブ行から順に）
    for(let c=0;c<7;c++){ const k=weekKeys[c]; if(!k)continue;
      siteOrder.forEach(id=>{ const arr=singleByCell[id+"__"+c]; if(!arr)return;
        arr.forEach(item=>{
          const sub=nextSub(id,c);
          const top=topPad+(laneBase[id]+sub)*(ROW+GAP), left=c*colW;
          if(item.kind==="chip"){ const e=item.e; const c2=effColor(e.work,e.site,e.color);
            overlay+=`<div class="chip" data-chipkey="${k}__${item.i}" title="${labelText(e)}" style="pointer-events:auto; cursor:grab; touch-action:none; position:absolute; left:calc(${left}% + 4px); width:calc(${colW}% - 8px); top:${top}px; height:${ROW}px; line-height:${ROW}px; font-size:10px; padding:0 5px; border-radius:5px; background:${e.done?c2.done:c2.bg}; color:${c2.fg}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${labelText(e)}</div>`;
          } else { const e=item.e;
            overlay+=`<div class="xchip" data-xchipkey="${k}__${item.i}" title="${extraChipLabel(e)}（実施）" style="pointer-events:auto; cursor:grab; touch-action:none; position:absolute; left:calc(${left}% + 4px); width:calc(${colW}% - 8px); top:${top}px; height:${ROW}px; line-height:${ROW}px; font-size:10px; padding:0 5px; border-radius:5px; background:${e.color.done}; color:#fff; border:1px solid ${e.color.fg}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${extraChipLabel(e)}</div>`;
          }
        });
      });
    }
    overlay+=`</div>`;
    weeksHtml+=`<div style="position:relative; margin-bottom:4px;">${cellsHtml}${overlay}</div>`;
  });

  const grid=document.getElementById("calgrid");
  grid.innerHTML=headRow+weeksHtml;
  wireCalendar(grid);
}

// span/chip/xchip のイベント配線＋末尾処理（通常/レーンモードで共通）
function wireCalendar(grid){
  grid.querySelectorAll(".span").forEach(el=>{
    const [id,w]=el.dataset.spankey.split("__");
    const s=sites.find(x=>x.id===Number(id)); const wk=s.works[w]; const c=effColor(w,s,wk.calColor);
    el.addEventListener("pointerdown",(e)=>{ if(!isPhone()){ e.preventDefault(); e.stopPropagation(); } startDrag(el,e,{type:"span",id:Number(id),w,label:el.textContent,bg:wk.act?c.done:c.bg,fg:c.fg,onClick:()=>{ openSpanEditor(s,w); if(singleVendorFilter()) showColorPicker({kind:"span",id:Number(id),w}); }}); });
  });
  grid.querySelectorAll(".chip").forEach(el=>{
    const [k,idx]=el.dataset.chipkey.split("__");
    const list=singlesOnDay(k); const e=list[Number(idx)]; if(!e) return; const c=effColor(e.work,e.site,e.color);
    el.addEventListener("pointerdown",(ev)=>{ if(!isPhone()){ ev.preventDefault(); ev.stopPropagation(); } startDrag(el,ev,{type:"chip",ref:e.ref,label:el.textContent,bg:e.done?c.done:c.bg,fg:c.fg,onClick:()=>{ const s=sites.find(x=>x.id===e.ref.id); if(e.ref.kind==="single")openDateInline(el,s.works[e.ref.w].plan,v=>{s.works[e.ref.w].plan=v; syncAndRefresh(s);}); else openDateInline(el,s.works[e.ref.w].items[e.ref.ix].plan,v=>{s.works[e.ref.w].items[e.ref.ix].plan=v; syncAndRefresh(s);}); if(singleVendorFilter()) showColorPicker(e.ref); }}); });
  });
  grid.querySelectorAll(".xchip").forEach(el=>{
    const [k,idx]=el.dataset.xchipkey.split("__");
    const list=extraChipsOnDay(k); const e=list[Number(idx)]; if(!e) return;
    if(e.kind==="mtg"){
      el.addEventListener("pointerdown",(ev)=>{ if(!isPhone()){ ev.preventDefault(); ev.stopPropagation(); } startDrag(el,ev,{type:"mtg",id:e.site.id,label:el.textContent,bg:e.color.done,fg:"#fff",onClick:()=>{
        const s=sites.find(x=>x.id===e.site.id);
        openDateTimeInline(el,s.act[0],s.mtgTime,(dv,tv,ev,av)=>{ s.act[0]=dv; s.mtgTime=tv; s.mtgEndTime=ev; s.attendee=av; refresh(); },s.mtgEndTime,s.attendee);
      }}); });
      return;
    }
    if(e.kind==="phase"){
      // ②③⑤⑥：ドラッグで日付移動、クリックで編集。実績があれば実績を、なければ予定を動かす
      const usesAct = !!e.site.act[e.phaseIdx];
      el.addEventListener("pointerdown",(ev)=>{ if(!isPhone()){ ev.preventDefault(); ev.stopPropagation(); } startDrag(el,ev,{type:"phase",id:e.site.id,phaseIdx:e.phaseIdx,useAct:usesAct,label:el.textContent,bg:e.color.done,fg:"#fff",onClick:()=>{
        const s=sites.find(x=>x.id===e.site.id); const i=e.phaseIdx;
        if(s.act[i]) openDateInline(el,s.act[i],v=>{ s.act[i]=v; refresh(); });
        else openDateInline(el,s.plan[i],v=>{ s.plan[i]=v; refresh(); });
      }}); });
      return;
    }
    const field = e.kind==="movein" ? "moveinClean" : "keyChange";
    el.addEventListener("pointerdown",(ev)=>{ if(!isPhone()){ ev.preventDefault(); ev.stopPropagation(); } startDrag(el,ev,{type:"extra",id:e.site.id,field,label:el.textContent,bg:e.color.done,fg:"#fff",onClick:()=>{
      const s=sites.find(x=>x.id===e.site.id);
      let opts={}; if(field==="keyChange"&&s.plan[3]) opts.min=dateAdd(s.plan[3],1);
      openDateInline(el,s[field].done,v=>{ if(field==="keyChange"&&v&&s.plan[3]&&v<=s.plan[3]){ alert(`鍵交換の実施日は、④工事の予定日（${fmt(s.plan[3])}）より後の日付にしてください。`); return; } s[field].done=v; refresh(); }, opts);
    }}); });
  });

  renderUnassigned();
  // 色ピッカーの再評価（絞り込みが単一業者でなくなったら隠す）
  const cp=document.getElementById("calcolorpicker");
  if(cp){ if(colorTargetRef && singleVendorFilter() && refByTarget(colorTargetRef)) showColorPicker(colorTargetRef); else { cp.style.display="none"; colorTargetRef=null; } }
}

// 要件6：単一業者絞り込み時に、クリックした予定の表示色を変更するパネル
let colorTargetRef=null;
function refByTarget(ref){
  const s=sites.find(x=>x.id===ref.id); if(!s) return null;
  if(ref.kind==="multi"){ const it=(s.works[ref.w].items||[])[ref.ix]; return it?{obj:it,site:s,work:ref.w}:null; }
  const wk=s.works[ref.w]; return wk?{obj:wk,site:s,work:ref.w}:null;
}
function showColorPicker(ref){
  const box=document.getElementById("calcolorpicker"); if(!box) return;
  if(!singleVendorFilter()){ box.style.display="none"; colorTargetRef=null; return; }
  const t=refByTarget(ref); if(!t){ box.style.display="none"; return; }
  colorTargetRef=ref;
  const cur=t.obj.calColor||null;
  const label=`[${WORKABBR[t.work]}]${t.site.name} ${t.site.room}`;
  const sw=CAL_PALETTE.map(p=>{
    const on = cur && cur.done===p.done;
    return `<button data-cc="${p.done}" title="${p.name}" style="width:26px; height:26px; border-radius:6px; background:${p.bg}; border:2px solid ${on?p.fg:'transparent'}; cursor:pointer; padding:0;"></button>`;
  }).join("");
  box.style.display="block";
  box.innerHTML=`<div style="background:var(--surface-1); border:0.5px solid var(--border); border-radius:10px; padding:10px 12px;">
    <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">表示色を変更（${label}）<span style="color:var(--text-muted);">※この業者に絞り込んだ時だけ反映</span></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">${sw}
      <button id="ccreset" style="font-size:11px; padding:4px 10px; margin-left:6px;">標準色に戻す</button>
      <button id="ccclose" style="font-size:11px; padding:4px 10px; margin-left:auto;">閉じる</button>
    </div></div>`;
  box.querySelectorAll("[data-cc]").forEach(el=>el.addEventListener("click",()=>{
    const p=CAL_PALETTE.find(x=>x.done===el.dataset.cc); const t2=refByTarget(colorTargetRef); if(!t2||!p) return;
    t2.obj.calColor={bg:p.bg,done:p.done,fg:p.fg}; refresh(); showColorPicker(colorTargetRef);
  }));
  box.querySelector("#ccreset").onclick=()=>{ const t2=refByTarget(colorTargetRef); if(t2){ delete t2.obj.calColor; refresh(); showColorPicker(colorTargetRef); } };
  box.querySelector("#ccclose").onclick=()=>{ box.style.display="none"; colorTargetRef=null; };
}

function renderUnassigned(){
  const ua=document.getElementById("unassigned");
  const vmatch=(v)=>vendorMatch(v);
  // 入居前清掃・鍵交換は工事(WORKDEF)ではないため未手配リストの対象外
  const isExtra = (calWork===EXTRA_MTG.key||calWork===EXTRA_MOVEIN.key||calWork===EXTRA_KEY.key);
  if(isExtra){ ua.innerHTML=`<div style="font-size:12px; color:var(--text-muted);">${calWork}の実施日は工事進捗管理表で入力します（発注・実施）。</div>`; return; }
  const worksToScan = calWork==="all" ? WORKS.slice() : [calWork];
  let list=[];
  worksToScan.forEach(w=>{
    sites.forEach(s=>{ if(!sitematch(s))return; const wk=s.works[w]; if(!wk)return;
      if(WORKDEF[w].type==="multi"){
        (wk.items||[]).forEach((it,ix)=>{ if(!it.plan && vmatch(it.vendor)) list.push({s,w,ix,name:it.name}); });
      } else {
        const un = WORKDEF[w].type==="span" ? (!wk.start||!wk.end) : !wk.plan;
        if(un && vmatch(wk.vendor)) list.push({s,w,ix:null});
      }
    });
  });
  if(list.length===0){ ua.innerHTML=`<div style="font-size:12px; color:var(--text-muted);">未手配の工事はありません。</div>`; return; }
  ua.innerHTML=`<div style="font-size:12px; font-weight:500; margin-bottom:6px;">未手配（カレンダーへドラッグ、またはクリック→日付クリックで割当）</div>
    <div id="unassignedbtns" style="display:flex; gap:6px; flex-wrap:wrap;">${list.map((it,i)=>{const c=WORKCOLOR[it.w]; const nm=(it.ix!=null&&it.name)?`（${it.name}）`:""; return `<div class="pill" data-pi="${i}" style="cursor:grab; touch-action:none; font-size:12px; padding:5px 11px; border-radius:var(--radius); border:0.5px solid ${c.fg}; background:${c.bg}; color:${c.fg};">[${WORKABBR[it.w]}]${it.s.name} ${it.s.room}${nm}</div>`;}).join("")}</div>`;
  ua.querySelectorAll("[data-pi]").forEach(el=>{
    const it=list[Number(el.dataset.pi)]; const c=WORKCOLOR[it.w];
    const nm=(it.ix!=null&&it.name)?`（${it.name}）`:"";
    el.addEventListener("pointerdown",(e)=>{ e.preventDefault(); startDrag(el,e,{type:"new",id:it.s.id,w:it.w,ix:it.ix,label:`[${WORKABBR[it.w]}]${it.s.name} ${it.s.room}${nm}`,bg:c.bg,fg:c.fg,onClick:()=>selectPick(it.s.id,it.w,it.ix)}); });
  });
}
let pickedSite=null, pickedWork=null, pickedIx=null, spanStart=null;
function selectPick(id,w,ix){

        else if(WORKDEF[pickedWork].type==="multi"){ if(pickedIx!=null&&wk.items&&wk.items[pickedIx]) wk.items[pickedIx].plan=key; pickedSite=null; pickedWork=null; pickedIx=null; syncAndRefresh(s); }

    });

// 期間工事の開始/終了を即反映。終了日は開始日より前に設定できない（開始日変更で終了日が前になる場合は開始日に揃える）
function editSpanDate(s,w,field,anchorEl,after){
  const wk=s.works[w];
  const opts={};
  if(field==="end" && wk.start) opts.min=wk.start;
  openDateInline(anchorEl, wk[field], (v)=>{
    if(field==="end" && v && wk.start && v<wk.start){ v=wk.start; }
    wk[field]=v;
    if(field==="start"){ if(wk.start && wk.end && wk.end<wk.start) wk.end=wk.start; }
    syncAndRefresh(s);
    if(after) after();
  }, opts);
}
// その現場の最終工事日（span終了/single予定/multi明細予定 の最大）
function latestWorkDate(s){
  let ds=[];
  Object.keys(s.works).forEach(w=>{ const t=WORKDEF[w].type, wk=s.works[w];
    if(t==="span"){ if(wk.end) ds.push(wk.end); else if(wk.start) ds.push(wk.start); }
    else if(t==="single"){ if(wk.plan) ds.push(wk.plan); }
    else if(t==="multi"){ (wk.items||[]).forEach(it=>{ if(it.plan) ds.push(it.plan); }); }
  });
  if(!ds.length) return null;
  ds.sort(); return ds[ds.length-1];
}
// ④予定(plan[3])を最終工事日に自動同期
function syncPhase5(s){ const d=latestWorkDate(s); if(d) s.plan[3]=d; }
function syncAllPhase5(){ sites.forEach(syncPhase5); }
// ⑤完了チェック(実績)が④最終工事日より前か（警告色の判定に使用）
function phase6IsPast(s){
  const last=s.plan[3]; if(!last) return false;
  if(s.act[4] && s.act[4]<last) return true;
  return false;
}
// 工事日を変更したら⑤を再同期して再描画（⑥が過去なら描画側でセルを警告色にする）
function syncAndRefresh(s){ syncPhase5(s); refresh(); }

// ===== データ保存・読込レイヤー（方式A：Googleスプレッドシート実接続） =====
// 保存形式：複雑な部分(works等)を含む現場データをJSONにまとめ、Apps Script経由で
// スプレッドシートのセルに読み書きする。URLは設定欄に貼る（下のGAS_URL）。
const SCHEMA_VERSION=1;
let GAS_URL=""; // Apps ScriptのウェブアプリURL（設定欄で入力）
let GAS_TOKEN=""; // 合言葉（Apps Script側のTOKENと一致させる）
let lastUpdatedAt=""; // シート側の最終更新時刻（競合検知用）
let autoSaveTimer=null;
let saving=false, pendingSave=false;
let dirty=false; // 未保存のローカル変更がある間はtrue（自動取込を止める）

function serializeData(){
  return JSON.stringify({ v:SCHEMA_VERSION, savedAt:new Date().toISOString(), nextId, vendorMaster, buildingMaster, zeroHolidays:[...zeroHolidays], sites });
}
function normalizeSite(raw){
  const s=Object.assign(newSite(raw.id,raw.name,raw.room,raw.category), raw, {open:false});
  // 配列長・型の防御（古いデータや欠損対策）
  const fix6=a=>{const r=Array.isArray(a)?a.slice(0,6):[]; while(r.length<6)r.push(null); return r;};
  s.plan=fix6(s.plan); s.act=fix6(s.act);
  if(!s.works||typeof s.works!=="object") s.works={};
  Object.keys(s.works).forEach(w=>{ const wk=s.works[w]; if(!wk||typeof wk!=="object"){ delete s.works[w]; return; }
    if(Array.isArray(wk.items)){ wk.items=wk.items.filter(it=>it&&typeof it==="object").map(it=>({name:it.name||"",plan:it.plan||null,act:it.act||null,vendor:it.vendor||null,calColor:it.calColor||null})); }
  });
  if(!s.moveinClean||typeof s.moveinClean!=="object") s.moveinClean={order:null,done:null};
  if(!s.keyChange||typeof s.keyChange!=="object") s.keyChange={order:null,done:null};
  if(s.mtgEndTime===undefined) s.mtgEndTime=null;
  if(s.attendee===undefined) s.attendee=null;
  if(s.memo===undefined) s.memo="";
  return s;
}
function applyData(obj){
  if(!obj||!Array.isArray(obj.sites)) throw new Error("データ形式が不正です");
  sites = obj.sites.map(normalizeSite);
  if(Array.isArray(obj.vendorMaster)&&obj.vendorMaster.length) vendorMaster=obj.vendorMaster;
  if(Array.isArray(obj.buildingMaster)) buildingMaster=obj.buildingMaster;
  zeroHolidays = new Set(Array.isArray(obj.zeroHolidays)?obj.zeroHolidays:[]);
  if(typeof obj.nextId==="number") nextId=obj.nextId;
  hankakuizeAll();
  syncAllPhase5(); renderStats(); renderBody(); renderCalendar();
}
function setSyncStatus(msg,ok){ const el=document.getElementById("syncStatus"); if(!el)return; el.textContent=msg; el.style.color= ok===false?"var(--text-danger)":ok===true?"var(--text-success)":"var(--text-muted)"; }
function fmtStamp(iso_){ try{ const d=new Date(iso_); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }catch(_){ return ""; } }

// URLの記憶（このブラウザに保存。localStorageが使えない環境では当セッションのみ）
function loadGasUrl(){ try{ return localStorage.getItem("gasUrl")||""; }catch(_){ return ""; } }
function saveGasUrl(u){ try{ localStorage.setItem("gasUrl",u); }catch(_){ } }
function loadGasToken(){ try{ return localStorage.getItem("gasToken")||""; }catch(_){ return ""; } }
function saveGasToken(t){ try{ localStorage.setItem("gasToken",t); }catch(_){ } }

// 起動時：シートから読み込み
async function cloudLoad(silent){
  if(!GAS_URL){ if(!silent) setSyncStatus("接続先URLが未設定です（設定を開いて入力）",false); return; }
  setSyncStatus("読み込み中…");
  try{
    const url=GAS_URL+(GAS_URL.includes("?")?"&":"?")+"token="+encodeURIComponent(GAS_TOKEN);
    const res=await fetch(url,{method:"GET"});
    const j=await res.json();
    if(!j.ok){ if(j.error==="unauthorized"){ setSyncStatus("合言葉が違います（接続設定を確認）",false); return; } throw new Error(j.error||"error"); }
    lastUpdatedAt=j.updatedAt||"";
    if(j.data){ applyData(JSON.parse(j.data)); dirty=false; setSyncStatus(`読み込みました（更新 ${fmtStamp(lastUpdatedAt)}）`,true); }
    else { setSyncStatus("シートは空です。現在の内容を保存すると初期データになります。"); }
  }catch(e){ setSyncStatus("読み込みに失敗しました（URL・共有設定を確認）",false); }
}
async function cloudSave(){
  if(!GAS_URL){ setSyncStatus("接続先URLが未設定です",false); return; }
  if(saving){ pendingSave=true; return; }
  saving=true; setSyncStatus("保存中…");
  try{
    const payload={ token:GAS_TOKEN, data:serializeData(), baseUpdatedAt:lastUpdatedAt||null };
    const res=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const j=await res.json();
    if(j.ok){ lastUpdatedAt=j.updatedAt||lastUpdatedAt; dirty=false; setSyncStatus(`保存しました（${fmtStamp(j.updatedAt)}）`,true); }
    else if(j.error==="unauthorized"){ setSyncStatus("合言葉が違います（接続設定を確認）",false); }
    else if(j.error==="conflict"){
      setSyncStatus("他の人が先に更新しました。最新を読み込みます…",false);
      await cloudLoad(true);
      setSyncStatus("最新を読み込みました。編集内容を確認して再度保存してください。",false);
    }
    else if(j.error==="busy"){ setSyncStatus("混み合っています。少し後に自動再保存します。"); pendingSave=true; }
    else throw new Error(j.error||"error");
  }catch(e){ setSyncStatus("保存に失敗しました（通信・URLを確認）",false); }
  finally{
    saving=false;
    if(pendingSave){ pendingSave=false; setTimeout(cloudSave,800); }
  }
}
// 自動保存（連続編集をまとめる：最後の編集から1.2秒後に1回だけ送信）
function scheduleAutoSave(){
  if(!GAS_URL) return;
  if(autoSaveTimer) clearTimeout(autoSaveTimer);
  setSyncStatus("編集あり（まもなく自動保存）");
  autoSaveTimer=setTimeout(()=>{ autoSaveTimer=null; cloudSave(); },1200);
}

// ===== 定期自動更新（開きっぱなしでも最新化） =====
const POLL_INTERVAL_MS=30000; // チェック間隔（30秒）。変更可
let pollTimer=null, polling=false;
// いま編集中か（編集中は自動取り込みを見送る）
function isEditing(){
  // 未保存のローカル変更がある間は絶対に取り込まない（保存優先）
  if(dirty) return true;
  // 日付/時刻の入力ポップアップ、列フィルター、各種モーダルが開いている
  if(document.getElementById("inlinedate")||document.getElementById("inlinedt")||document.getElementById("inlinetime")) return true;
  if(document.getElementById("colfilterpop")||document.getElementById("settingsmodal")||document.getElementById("newsitemodal")||document.getElementById("zeroholmodal")) return true;
  // 自動保存待ち・保存中・ドラッグ中
  if(autoSaveTimer||saving||pendingSave) return true;
  if(typeof DND!=="undefined" && DND) return true;
  // テキスト入力中（検索欄など）
  const ae=document.activeElement;
  if(ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT")) return true;
  return false;
}
// サーバの更新時刻だけ軽く確認し、新しければ静かに取り込む
async function pollCheck(){
  if(!GAS_URL||polling) return;
  if(isEditing()) return; // 編集中は見送り（次回チェックで再判定）
  polling=true;
  try{
    const url=GAS_URL+(GAS_URL.includes("?")?"&":"?")+"token="+encodeURIComponent(GAS_TOKEN);
    const res=await fetch(url,{method:"GET"});
    const j=await res.json();
    if(j.ok && j.updatedAt && j.updatedAt!==lastUpdatedAt){
      // 取り込み直前にもう一度編集中チェック（この間に操作を始めた場合は中止）
      if(isEditing()){ polling=false; return; }
      lastUpdatedAt=j.updatedAt;
      if(j.data){ applyData(JSON.parse(j.data)); dirty=false; setSyncStatus(`他の人の更新を反映しました（${fmtStamp(j.updatedAt)}）`,true); }
    }
  }catch(e){ /* 通信失敗は次回に任せる（画面は止めない） */ }
  finally{ polling=false; }
}
function startPolling(){ if(pollTimer) clearInterval(pollTimer); pollTimer=setInterval(pollCheck,POLL_INTERVAL_MS); }

// 手動：読込ボタン（未保存があれば警告）
function doLoad(){ if(dirty && !confirm("未保存の変更があります。読み込むとこの変更は失われます。よろしいですか？")) return; cloudLoad(false); }
// ファイル書出（バックアップ用）
function doExport(){
  const blob=new Blob([serializeData()],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const p=n=>String(n).padStart(2,"0"); const d=new Date();
  a.href=url; a.download=`リフォーム進捗データ_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  setSyncStatus("ファイルを書き出しました",true);
}
// ファイル取込（復元用）。取込後は自動保存でシートにも反映
function doImport(file){
  const reader=new FileReader();
  reader.onload=()=>{ try{ const obj=JSON.parse(reader.result); applyData(obj); setSyncStatus(`ファイルを取り込みました（${file.name}）`,true); scheduleAutoSave(); }catch(e){ setSyncStatus("取込に失敗しました（ファイル形式を確認）",false); } };
  reader.onerror=()=>setSyncStatus("ファイル読み取りに失敗しました",false);
  reader.readAsText(file);
}
