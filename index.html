// ===== 業者向けPDF出力 =====
// 現在のカレンダー表示期間（月/週）を、指定業者の工事だけに絞って印刷用HTMLに描画する。
// 既存のdaysInPeriod/週組みロジックを踏襲。ドラッグ等のインタラクションは持たせない（静的表示）。
function pdfSpansForVendor(vendor){
  let e=[];
  sites.forEach(s=>{ Object.keys(s.works).forEach(w=>{ if(WORKDEF[w].type!=="span")return; const wk=s.works[w];
    if(wk.start&&wk.end&&wk.vendor===vendor) e.push({start:wk.start,end:wk.end,work:w,site:s,vendor:wk.vendor,done:!!wk.act,color:wk.calColor||null}); }); });
  return e;
}
function pdfSinglesOnDay(key,vendor){
  let out=[];
  sites.forEach(s=>{ Object.keys(s.works).forEach(w=>{ const t=WORKDEF[w].type, wk=s.works[w];
    if(t==="multi"){ (wk.items||[]).forEach(it=>{ if(it.plan===key&&it.vendor===vendor) out.push({work:w,site:s,vendor:it.vendor,name:it.name,done:!!it.act,color:it.calColor||null}); }); }
    else if(t==="single"){ if(wk.plan===key&&wk.vendor===vendor) out.push({work:w,site:s,vendor:wk.vendor,done:!!wk.act,color:wk.calColor||null}); }
  }); });
  return out;
}
// PDF用の色解決：カレンダーの色変更(calColor)と、ZERO業者のクリーニング請求先色を反映
function pdfColor(vendor,work,site,customColor){
  if(customColor) return customColor;
  if(vendor==="ZERO" && work==="クリーニング"){ return ZERO_BILL_COLOR[site.billTo]||WORKCOLOR["クリーニング"]; }
  return WORKCOLOR[work];
}
// 一覧用：期間内に掛かる、その業者の全工事（span/single/multi明細）を集める
function pdfListForVendor(vendor,days){
  const first=iso(days[0].getFullYear(),days[0].getMonth(),days[0].getDate());
  const last=iso(days[days.length-1].getFullYear(),days[days.length-1].getMonth(),days[days.length-1].getDate());
  const inRange=(a,b)=>{ // 期間[a,b]がカレンダー範囲[first,last]と重なるか
    const bb=b||a; return a&&(a<=last)&&(bb>=first);
  };
  let rows=[];
  sites.forEach(s=>{ Object.keys(s.works).forEach(w=>{ const t=WORKDEF[w].type, wk=s.works[w];
    if(t==="span"){ if(wk.vendor===vendor && wk.start && inRange(wk.start,wk.end))
      rows.push({site:s,work:w,name:"",start:wk.start,end:wk.end,act:wk.act,kind:"span"}); }
    else if(t==="single"){ if(wk.vendor===vendor && wk.plan && inRange(wk.plan,null))
      rows.push({site:s,work:w,name:"",start:wk.plan,end:null,act:wk.act,kind:"single"}); }
    else if(t==="multi"){ (wk.items||[]).forEach(it=>{ if(it.vendor===vendor && it.plan && inRange(it.plan,null))
      rows.push({site:s,work:w,name:it.name||"",start:it.plan,end:null,act:it.act,kind:"multi"}); }); }
  }); });
  rows.sort((a,b)=>(a.start||"").localeCompare(b.start||"")||siteLabel(a.site).localeCompare(siteLabel(b.site)));
  return rows;
}
function buildPdf(){
  const vendor=calVendor;
  if(vendor==="all"||vendor===VENDOR_AZ){ alert("PDFを作成するには、上の業者プルダウンから業者を1つ選んでください。選んだ業者の工事だけを出力します。"); return; }

  const days=daysInPeriod();
  const y=calAnchor.getFullYear(), m=calAnchor.getMonth();
  let perLabel;
  if(calView==="week"){ const a=days[0],b=days[6]; perLabel=`${a.getFullYear()}年 ${a.getMonth()+1}/${a.getDate()} 〜 ${b.getMonth()+1}/${b.getDate()}`; }
  else perLabel=`${y}年${m+1}月`;

  const keyOf=dt=>iso(dt.getFullYear(),dt.getMonth(),dt.getDate());
  const tKey=todayKey();

  // 週組み（renderCalendarと同じ規則）
  let weeks=[];
  if(calView==="week") weeks=[days];
  else { const firstDow=days[0].getDay(); let row=new Array(firstDow).fill(null); days.forEach(dt=>{row.push(dt); if(row.length===7){weeks.push(row); row=[];}}); if(row.length){while(row.length<7)row.push(null); weeks.push(row);} }

  // スロット割当（帯の重なり回避、renderCalendarと同じ）
  let spans=pdfSpansForVendor(vendor);
  spans.sort((a,b)=>a.start.localeCompare(b.start));
  const slotEnds=[]; spans.forEach(e=>{let sl=0; while(sl<slotEnds.length&&slotEnds[sl]>=e.start)sl++; e.slot=sl; slotEnds[sl]=e.end;});

  const wd=["日","月","火","水","木","金","土"];
  const ROW2=16, GAP2=2, colW=100/7;

  // 見出し
  let html=`<div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px;">
      <div>
        <div style="font-size:18px; font-weight:700;">工事予定表 — ${escapeHtml(vendor)} 御中</div>
        <div style="font-size:13px; color:#333; margin-top:2px;">対象期間：${perLabel}</div>
      </div>
      <div style="font-size:11px; color:#555; text-align:right;">アライヴグループ<br>発行日：${fmt(tKey)}</div>
    </div>`;

  // 凡例
  const usedWorks=[...new Set([...spans.map(e=>e.work), ...weeks.flat().filter(Boolean).flatMap(dt=>pdfSinglesOnDay(keyOf(dt),vendor).map(e=>e.work))])];
  if(usedWorks.length){
    html+=`<div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:8px; font-size:11px;">`+
      usedWorks.map(w=>{const c=WORKCOLOR[w]; return `<span style="display:inline-flex; align-items:center; gap:4px;"><span style="width:11px; height:11px; border-radius:2px; background:${c.bg}; border:1px solid ${c.fg};"></span>${w}</span>`;}).join("")+
      (vendor==="ZERO"&&usedWorks.includes("クリーニング") ? `<span style="color:#666;">｜清掃色＝請求先：</span>`+Object.keys(ZERO_BILL_COLOR).map(b=>{const c=ZERO_BILL_COLOR[b]; return `<span style="display:inline-flex; align-items:center; gap:4px;"><span style="width:11px; height:11px; border-radius:2px; background:${c.done}; border:1px solid ${c.fg};"></span>${b}</span>`;}).join("") : "")+
      `<span style="color:#666;">（濃い色＝完了済み）</span></div>`;
  }

  // 曜日ヘッダ
  html+=`<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px;">`+
    wd.map((d,i)=>`<div style="text-align:center; font-size:11px; font-weight:600; color:${i===0?'#c0392b':i===6?'#2563eb':'#444'};">${d}</div>`).join("")+`</div>`;

  // 週ごと
  weeks.forEach(week=>{
    let usedSpanSlots=0;
    week.forEach(dt=>{ if(!dt)return; const k=keyOf(dt); spans.forEach(e=>{ if(k>=e.start&&k<=e.end) usedSpanSlots=Math.max(usedSpanSlots,e.slot+1); }); });
    const spanAreaH=usedSpanSlots*(ROW2+GAP2);
    const topPad=22, cellMinH=(calView==="week"?96:64);

    let cellsHtml=`<div class="pdf-daygrid" style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px; position:relative;">`;
    week.forEach(dt=>{
      if(!dt){ cellsHtml+=`<div></div>`; return; }
      const k=keyOf(dt), dow=dt.getDay(), isToday=(k===tKey);
      const hol=holidayName(k);
      const singles=pdfSinglesOnDay(k,vendor);
      const chips=singles.map(e=>{const c=pdfColor(vendor,e.work,e.site,e.color); return `<div style="background:${e.done?c.done:c.bg}; border:1px solid ${c.fg}; color:${c.fg}; font-size:9px; line-height:1.25; padding:1px 4px; margin-top:2px; border-radius:4px; word-break:break-word;">${escapeHtml(pdfLabel(e))}</div>`;}).join("");
      const dnumColor = dow===0?'#c0392b':(hol?'#c0392b':dow===6?'#2563eb':'#555');
      const cellBg = isToday?'#eef3fd':(hol?'#f8d7d7':'#fff');
      const holLabel = hol?`<div style="font-size:8px; color:#c0392b; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${hol}</div>`:'';
      cellsHtml+=`<div class="pdf-daycell" style="min-height:${cellMinH}px; border:${isToday?'1.2px solid #2563eb':'0.5px solid #ccc'}; border-radius:6px; padding:3px; background:${cellBg};">
        <div style="font-size:11px; color:${dnumColor}; font-weight:${isToday?'700':'400'};">${dt.getDate()}${isToday?' <span style="font-size:8px; padding:0 3px; border-radius:3px; background:#dbeafe; color:#2563eb;">今日</span>':''}</div>${holLabel}
        <div style="height:${spanAreaH}px;"></div>${chips}</div>`;
    });
    cellsHtml+=`</div>`;

    let overlay=`<div style="position:absolute; inset:0; pointer-events:none;">`;
    const weekKeys=week.map(dt=>dt?keyOf(dt):null);
    spans.forEach(e=>{
      let fc=-1,lc=-1; for(let c=0;c<7;c++){const k=weekKeys[c]; if(k&&k>=e.start&&k<=e.end){if(fc<0)fc=c; lc=c;}}
      if(fc<0) return;
      const left=fc*colW, width=(lc-fc+1)*colW, top=topPad+e.slot*(ROW2+GAP2);
      const startsHere=weekKeys[fc]===e.start, endsHere=weekKeys[lc]===e.end;
      const c=pdfColor(vendor,e.work,e.site,e.color), bg=e.done?c.done:c.bg, fg=c.fg;
      const radius=`${startsHere?'5px':'2px'} ${endsHere?'5px':'2px'} ${endsHere?'5px':'2px'} ${startsHere?'5px':'2px'}`;
      overlay+=`<div style="position:absolute; left:calc(${left}% + 3px); width:calc(${width}% - 6px); top:${top}px; height:${ROW2}px; line-height:${ROW2}px; font-size:9px; padding:0 4px; border-radius:${radius}; background:${bg}; border:1px solid ${fg}; color:${fg}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600;">${escapeHtml(pdfLabel(e))}</div>`;
    });
    overlay+=`</div>`;
    html+=`<div class="pdf-week" style="position:relative; margin-bottom:3px;">${cellsHtml}${overlay}</div>`;
  });

  // 現場名一覧（この業者の工事が期間内にある現場を1行ずつ。新項目＋金額合計）
  const list=pdfListForVendor(vendor,days);
  // 現場ごとに集約（重複排除、順序は最初の予定日順）
  const siteOrder=[]; const seen=new Set();
  list.forEach(r=>{ if(!seen.has(r.site.id)){ seen.add(r.site.id); siteOrder.push(r.site); } });

  const yen=n=>(n==null||n==="")?"":("¥"+Number(n).toLocaleString("ja-JP"));
  // この業者が期間内にクリーニング工事を担当していれば金額列＆内装完了列を表示
  const showMoney = list.some(r=>r.work==="クリーニング");
  const showNaiso = showMoney; // 内装完了はクリーニング業者のみ
  // 対象業者のその現場での作業予定日（リフォームは期間、他は単日）
  const workDateForSite=(s)=>{
    // その現場でこの業者が担当する工事の予定日を集める
    let spans=[], singles=[];
    Object.keys(s.works).forEach(w=>{ const t=WORKDEF[w].type, wk=s.works[w];
      if(t==="span"){ if(wk.vendor===vendor && wk.start) spans.push(`${fmt(wk.start)}〜${fmt(wk.end)||''}`); }
      else if(t==="single"){ if(wk.vendor===vendor && wk.plan) singles.push(fmt(wk.plan)); }
      else if(t==="multi"){ (wk.items||[]).forEach(it=>{ if(it.vendor===vendor && it.plan) singles.push(fmt(it.plan)); }); }
    });
    return [...spans,...singles].join("、");
  };
  const PER_PAGE=20;
  let listHtml="";
  if(siteOrder.length===0){
    listHtml=`<div style="font-size:12px; color:#666; margin-top:12px;">この期間に対象の現場はありません。</div>`;
  } else {
    // 合計（全ページ通算、金額列表示時のみ）
    let tClean=0,tAc=0,tPeel=0;
    siteOrder.forEach(s=>{ const wk=s.works["クリーニング"]; if(wk){ tClean+=Number(wk.cleanFee||0); tAc+=Number(wk.acFee||0); tPeel+=Number(wk.peelFee||0);} });
    const grand=tClean+tAc+tPeel;

    const naisoHead = showNaiso ? `<th style="padding:4px 6px; border:0.5px solid #ccc;">内装完了</th>` : "";
    const moneyHead = showMoney ? `
            <th style="padding:4px 6px; border:0.5px solid #ccc; text-align:right;">清掃費</th>
            <th style="padding:4px 6px; border:0.5px solid #ccc; text-align:right;">エアコン</th>
            <th style="padding:4px 6px; border:0.5px solid #ccc; text-align:right;">剥離</th>` : "";

    const pages=Math.ceil(siteOrder.length/PER_PAGE);
    for(let p=0;p<pages;p++){
      const chunk=siteOrder.slice(p*PER_PAGE,(p+1)*PER_PAGE);
      const isLast=(p===pages-1);
      const pageBreak = p>0 ? 'break-before:page;' : '';
      listHtml+=`<div style="${pageBreak} margin-top:${p>0?'0':'14px'};">
        <div style="font-size:14px; font-weight:700; margin-bottom:6px; border-bottom:1.5px solid #333; padding-bottom:3px;">現場名一覧（${escapeHtml(vendor)}）${pages>1?` <span style="font-size:11px; font-weight:400;">${p+1}/${pages}ページ</span>`:''}</div>
        <table style="width:100%; border-collapse:collapse; font-size:10.5px;">
          <thead><tr style="background:#f0efea; text-align:left;">
            <th style="padding:4px 6px; border:0.5px solid #ccc;">作業予定日</th>
            <th style="padding:4px 6px; border:0.5px solid #ccc;">現場名</th>${naisoHead}
            <th style="padding:4px 6px; border:0.5px solid #ccc;">請求先</th>
            <th style="padding:4px 6px; border:0.5px solid #ccc;">家具</th>${moneyHead}
            <th style="padding:4px 6px; border:0.5px solid #ccc;">オートロック</th>
            <th style="padding:4px 6px; border:0.5px solid #ccc;">備考</th>
          </tr></thead><tbody>`;
      chunk.forEach(s=>{
        const rf=s.works["リフォーム"]; const naiso=rf&&rf.end?fmt(rf.end):"";
        const wk=s.works["クリーニング"]||{};
        const furn=s.furniture==="あり"?"あり":"";  // なしは空欄
        const naisoCell = showNaiso ? `<td style="padding:4px 6px; border:0.5px solid #ccc; white-space:nowrap;">${naiso}</td>` : "";
        const moneyCells = showMoney ? `
          <td style="padding:4px 6px; border:0.5px solid #ccc; text-align:right;">${yen(wk.cleanFee)}</td>
          <td style="padding:4px 6px; border:0.5px solid #ccc; text-align:right;">${yen(wk.acFee)}</td>
          <td style="padding:4px 6px; border:0.5px solid #ccc; text-align:right;">${yen(wk.peelFee)}</td>` : "";
        listHtml+=`<tr>
          <td style="padding:4px 6px; border:0.5px solid #ccc; white-space:nowrap;">${workDateForSite(s)}</td>
          <td style="padding:4px 6px; border:0.5px solid #ccc; white-space:nowrap;">${escapeHtml(siteLabel(s))}号室</td>${naisoCell}
          <td style="padding:4px 6px; border:0.5px solid #ccc;">${escapeHtml(s.billTo||"")}</td>
          <td style="padding:4px 6px; border:0.5px solid #ccc;">${furn}</td>${moneyCells}
          <td style="padding:4px 6px; border:0.5px solid #ccc;">${escapeHtml(s.autolock||"")}</td>
          <td style="padding:4px 6px; border:0.5px solid #ccc;">${escapeHtml(s.note||"")}</td>
        </tr>`;
      });
      // 合計・総合計行は最終ページ、金額列表示時のみ
      if(isLast && showMoney){
        const leadCols = 2 + (showNaiso?1:0) + 2; // 作業予定日,現場名,(内装完了),請求先,家具
        listHtml+=`<tr style="background:#eef1ee; font-weight:700;">
          <td colspan="${leadCols}" style="padding:5px 6px; border:0.5px solid #ccc; text-align:right;">合計</td>
          <td style="padding:5px 6px; border:0.5px solid #ccc; text-align:right;">${yen(tClean)}</td>
          <td style="padding:5px 6px; border:0.5px solid #ccc; text-align:right;">${yen(tAc)}</td>
          <td style="padding:5px 6px; border:0.5px solid #ccc; text-align:right;">${yen(tPeel)}</td>
          <td colspan="2" style="padding:5px 6px; border:0.5px solid #ccc;"></td>
        </tr>
        <tr style="background:#e2e8dd; font-weight:700;">
          <td colspan="${leadCols}" style="padding:5px 6px; border:0.5px solid #ccc; text-align:right;">総合計（清掃費＋エアコン＋剥離）</td>
          <td colspan="3" style="padding:5px 6px; border:0.5px solid #ccc; text-align:right;">${yen(grand)}</td>
          <td colspan="2" style="padding:5px 6px; border:0.5px solid #ccc;"></td>
        </tr>`;
      }
      listHtml+=`</tbody></table></div>`;
    }
  }
  html+=listHtml;

  // 非表示iframeにPDF内容を書き込み、そのiframeだけを印刷する。
  // 別ウィンドウ（window.open）方式は、ポップアップブロックや子ウィンドウのフォーカス奪取で
  // 親画面のUI（ドロップダウン等）が反応しなくなる問題があったため、iframe方式に変更。
  const todayStr = iso(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()); // 作成日 YYYY-MM-DD
  const pdfTitle = `工事予定表 ${vendor} ${todayStr}`;
  const doc=`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>${escapeHtml(pdfTitle)}</title>
    <style>
      *{box-sizing:border-box; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;}
      body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif; margin:0; padding:14px; color:#222; background:#fff;}
      @media print{ @page{size:A4 portrait; margin:10mm;} body{padding:0;} .pdf-week,.pdf-daycell{break-inside:avoid;} }
    </style></head><body>${html}</body></html>`;

  const old=document.getElementById("pdfframe"); if(old) old.remove();
  const iframe=document.createElement("iframe");
  iframe.id="pdfframe";
  iframe.style.cssText="position:fixed; right:0; bottom:0; width:0; height:0; border:0; visibility:hidden;";
  document.body.appendChild(iframe);
  let printed=false;
  // 保存ダイアログの既定ファイル名は多くのブラウザで「親ページのdocument.title」を使うため、
  // 印刷の間だけ親のtitleをPDF名に差し替え、終了後に元へ戻す。
  const restoreTitle=()=>{ document.title=APP_TITLE; };
  const doPrint=()=>{ if(printed)return; printed=true;
    try{
      const win=iframe.contentWindow;
      document.title=pdfTitle;           // 親ページのタイトルを一時変更
      win.focus(); win.print();
    }catch(err){ alert("印刷の起動に失敗しました。ブラウザの印刷機能をご利用ください。"); }
    finally{
      // 印刷ダイアログが閉じた後に復元（afterprint、無ければ遅延で保険）
      window.addEventListener("afterprint",restoreTitle,{once:true});
      setTimeout(restoreTitle,60000);
    }
  };
  iframe.addEventListener("load",doPrint);
  const idoc=iframe.contentWindow.document;
  idoc.open(); idoc.write(doc); idoc.close();
  // 一部ブラウザで about:blank のloadが発火しない場合に備えたフォールバック
  setTimeout(doPrint,500);
}

function openZeroHolidayModal(){
  const old=document.getElementById("zeroholmodal"); if(old) old.remove();
  let viewY=calAnchor.getFullYear(), viewM=calAnchor.getMonth();
  const ov=document.createElement("div");
  ov.id="zeroholmodal";
  ov.style.cssText="position:fixed; inset:0; z-index:11000; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center;";
  ov.innerHTML=`<div style="background:var(--surface-2); border-radius:12px; padding:18px; width:340px; max-width:94vw; box-shadow:0 10px 40px rgba(0,0,0,.25);">
    <div style="font-size:15px; font-weight:600; margin-bottom:4px;">ZERO休みの登録</div>
    <div style="font-size:11px; color:var(--text-muted); margin-bottom:12px;">日付をタップで登録／解除（複数選択可）。グレーの日がZERO休みです。</div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <button id="zhPrev" style="font-size:13px; padding:3px 10px;">‹</button>
      <span id="zhLabel" style="font-size:14px; font-weight:500;"></span>
      <button id="zhNext" style="font-size:13px; padding:3px 10px;">›</button>
    </div>
    <div id="zhGrid"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">
      <button id="zhClose" style="font-size:13px; padding:6px 16px; background:var(--text-accent); color:#fff; border-color:var(--text-accent);">閉じる</button>
    </div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); refresh(); };
  ov.addEventListener("click",e=>{ if(e.target===ov) close(); });
  ov.querySelector("#zhClose").onclick=close;
  const wd=["日","月","火","水","木","金","土"];
  const draw=()=>{
    ov.querySelector("#zhLabel").textContent=`${viewY}年${viewM+1}月`;
    const first=new Date(viewY,viewM,1), firstDow=first.getDay();
    const ndays=new Date(viewY,viewM+1,0).getDate();
    let cells=wd.map((d,i)=>`<div style="text-align:center; font-size:11px; color:${i===0?'var(--text-danger)':i===6?'var(--text-accent)':'var(--text-secondary)'};">${d}</div>`).join("");
    for(let i=0;i<firstDow;i++) cells+=`<div></div>`;
    for(let d=1;d<=ndays;d++){
      const k=iso(viewY,viewM,d); const on=zeroHolidays.has(k); const hol=holidayName(k);
      const dow=new Date(viewY,viewM,d).getDay();
      const col=on?'#374151':(hol||dow===0?'var(--text-danger)':dow===6?'var(--text-accent)':'var(--text-primary)');
      cells+=`<div data-zk="${k}" style="text-align:center; font-size:13px; padding:7px 0; border-radius:6px; cursor:pointer; background:${on?'#d1d5db':'transparent'}; color:${col}; font-weight:${on?'600':'400'}; border:1px solid ${on?'#9ca3af':'transparent'};">${d}</div>`;
    }
    const g=ov.querySelector("#zhGrid");
    g.innerHTML=`<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:3px;">${cells}</div>`;
    g.querySelectorAll("[data-zk]").forEach(el=>el.addEventListener("click",()=>{ const k=el.dataset.zk; if(zeroHolidays.has(k))zeroHolidays.delete(k); else zeroHolidays.add(k); dirty=true; draw(); }));
  };
  ov.querySelector("#zhPrev").onclick=()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} draw(); };
  ov.querySelector("#zhNext").onclick=()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} draw(); };
  draw();
}
